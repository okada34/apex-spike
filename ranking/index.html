<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランキング｜Apexサークル戦績</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#241C52">
<link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サークル戦績">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#241C52; --card:#332A70; --sunken:#2E2559; --line:#493D96; --dim:#3B3178;
    --purple:#7C5CFF; --yellow:#FFE646; --lime:#C8FF00; --red:#FF5470;
    --ink:#FFFFFF; --ink2:#C6BCF2; --ink3:#A99CE0; --ink4:#8478C4; --invert:#241C52;
    --limeDark:#9CC700;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; padding:0; background:var(--ground); color:var(--ink);
    font-family:'RocknRoll One','Hiragino Sans','Yu Gothic',sans-serif;
    font-size:14px; line-height:1.7; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .dela{ font-family:'Dela Gothic One','Hiragino Sans',sans-serif; font-weight:400; }
  .mono{ font-family:'Roboto Mono',ui-monospace,monospace; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }

  /* 下に切替バー(実測66.7px)と下タブ(70px)が重なるので、その2つぶん逃がす */
  .wrap{ max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
         padding-bottom:calc(140px + env(safe-area-inset-bottom)); }
  main{ flex:1; }

  /* === iPhoneのノッチ・時計を避ける ===
     viewport-fit=cover は画面の端まで描く指定なので、
     **上下とも自分で避ける必要がある。**下だけ避けていて上が抜けており、
     iPhoneで時計・電池と重なって歯車が押せなかった */
  header{
    position:sticky; top:0; z-index:20; background:var(--ground);
    padding:calc(16px + env(safe-area-inset-top)) 18px 12px; display:flex; align-items:baseline; justify-content:space-between; gap:11px;
  }
  header .ttl{ font-family:'Dela Gothic One',sans-serif; font-size:17px; }
  header .per{ font-size:10.5px; color:var(--ink3); }

  /* ---- 期間と軸 ---- */
  .chips{ display:flex; gap:8px; margin:0 18px; }
  .chip{
    position:relative; display:flex; align-items:center; background:var(--card);
    border-radius:20px; padding:0; flex:none; overflow:hidden;
  }
  .chip select{
    appearance:none; -webkit-appearance:none; background:transparent; border:0; outline:none;
    color:var(--ink); font-family:'RocknRoll One',sans-serif; font-size:12px;
    padding:9px 30px 9px 14px; cursor:pointer;
  }
  .chip select option{ background:var(--card); color:var(--ink); }
  .chip .cv{ position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex; }

  /* ---- 指標タブ（横に流れる） ---- */
  .mtabs{
    display:flex; gap:7px; margin-top:14px; padding:0 18px 2px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .mtabs::-webkit-scrollbar{ display:none; }
  .mtab{
    flex:none; border-radius:20px; padding:8px 14px; background:var(--sunken); border:0; cursor:pointer;
    font-family:'RocknRoll One',sans-serif; font-size:11.5px; color:var(--ink2); white-space:nowrap;
  }
  .mtab.on{ background:var(--purple); color:var(--ink); }

  /* ---- 横スワイプで指標を変える ---- */
  /*
     pan-y = 「縦は今までどおりブラウザに任せる。横だけこちらで扱う」
     これを書かないと、横に振ったときブラウザが先に反応して指を持っていかれる
  */
  /*
     動かしたぶんを、ページの横スクロール領域に足させない。

     **これが無いと壊れる。**合成レイヤーに載った要素を横へ動かすと、
     ブラウザは横スクロール領域を広げる。ところが元へ戻したとき、
     **広げた領域を計算し直さない。**幻の余白が残り、
     そこへ何かがスクロールすると、body が overflow-x:hidden なので
     **指では二度と戻せない。**（実機で実際に起きた）

     clip は hidden と違ってスクロール箱を作らないので、
     中の position:sticky / fixed を壊さない。
     対応していないブラウザは hidden に落ちる（main の中に sticky は無いので実害なし）。
  */
  main#app{ overflow-x:hidden; overflow-x:clip; }

  /* will-change は触っている間だけ付ける。付けっぱなしは上の再計算漏れを招く */
  #swipe{ touch-action:pan-y; }
  #swipe.moving{ will-change:transform, opacity; }
  #swipe.sliding{ transition:transform .19s cubic-bezier(.22,.61,.36,1), opacity .19s ease; }

  /* 指標バーは自前で横に動く。ここまでこちらが横を奪うと、バーが動かせなくなる */
  .mtabs{ touch-action:pan-x; }

  /* 個人／構成のバーも横に振れる */
  #seg{ touch-action:pan-y; overflow-x:hidden; overflow-x:clip; }
  #seg .in.moving{ will-change:transform; }
  #seg .in.sliding{ transition:transform .19s cubic-bezier(.22,.61,.36,1); }

  /* 端まで来たことを、跳ね返りで伝える */
  @keyframes nudge{ 0%{transform:translateX(0)} 35%{transform:translateX(var(--nx))} 100%{transform:translateX(0)} }
  #swipe.nudge{ animation:nudge .22s ease-out; }

  /* 動きを減らす設定の人には動かさない。切り替わりだけ伝わればよい */
  @media (prefers-reduced-motion: reduce){
    #swipe.sliding, #seg .in.sliding{ transition:none; }
    #swipe.nudge{ animation:none; }
  }

  /* ---- 順位の行 ---- */
  .rrow{ margin:0 18px 10px; background:var(--card); border-radius:18px; padding:14px 15px; }
  .rhead{ display:flex; align-items:center; gap:11px; }
  .rno{ width:26px; height:26px; border-radius:50%; background:var(--sunken); display:flex; align-items:center; justify-content:center; flex:none; }
  .rno span{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:12px; color:var(--ink2); letter-spacing:0; }
  .rno.top{ background:var(--lime); }
  .rno.top span{ color:var(--invert); }
  .rname{ font-family:'Dela Gothic One',sans-serif; font-size:15px; }
  .rval{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; }
  .rval b{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:22px; line-height:1; letter-spacing:-.04em; }
  .rval i{ font-style:normal; font-size:10px; color:var(--ink3); margin-top:3px; }
  .track{ height:7px; border-radius:4px; background:var(--sunken); margin-top:11px; overflow:hidden; }
  .track div{ height:100%; border-radius:4px; }
  .why{ font-size:10.5px; line-height:1.7; color:var(--ink3); margin-top:9px; }
  .rrow.off .rname, .rrow.off .rval b{ color:var(--ink3); }

  /* ---- 表彰 ---- */
  .award{ margin:0 18px 10px; background:var(--card); border-radius:18px; padding:15px; }
  .award .at{ display:flex; align-items:center; gap:10px; }
  .atag{ font-size:10px; background:var(--yellow); color:var(--invert); padding:3px 9px; border-radius:20px; flex:none; }
  .award .an{ font-family:'Dela Gothic One',sans-serif; font-size:17px; }
  .award .av{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:24px; letter-spacing:-.04em; margin-left:auto; }
  .award .ad{ font-size:10.5px; line-height:1.7; color:var(--ink3); margin-top:8px; }

  .toAwards{
    margin:18px 18px 0; border-radius:14px; padding:13px 15px; width:calc(100% - 36px);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:0; cursor:pointer; text-align:left;
  }
  .toAwards.hot{ background:var(--yellow); color:var(--invert); transform:rotate(-1.4deg); }
  .toAwards.cool{ background:var(--card); color:var(--ink); }

  /* ---- 構成 ---- */
  .compo{ margin:0 18px 10px; background:var(--card); border-radius:18px; padding:15px; }
  .compo .ct{ font-size:11.5px; color:var(--ink2); }
  .compo .cv{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:26px; letter-spacing:-.04em; margin-top:2px; }
  .compo .cv small{ font-family:'RocknRoll One',sans-serif; font-size:11.5px; color:var(--ink3); margin-left:4px; font-weight:400; letter-spacing:0; }
  .mem{ display:flex; align-items:center; gap:9px; padding:7px 0 0; }
  .mem .lg{ font-size:12.5px; }
  .mem .pn{ font-size:11px; color:var(--ink3); margin-left:auto; }
  .compo .cg{ display:flex; justify-content:space-between; align-items:baseline; margin-top:11px; padding-top:10px; border-top:1px solid var(--line); }
  .compo .cg span{ font-size:10.5px; color:var(--ink3); }
  .cother{ font-size:10.5px; color:var(--ink3); margin-top:7px; padding-top:7px; border-top:1px dashed var(--line); }

  .cbadge{ font-size:10px; background:var(--lime); color:var(--invert); padding:2px 8px; border-radius:20px; }

  .card{ background:var(--card); border-radius:18px; padding:15px; margin:0 18px 10px; }
  .sec{ font-family:'Dela Gothic One',sans-serif; font-size:15px; margin:22px 18px 10px; }
  .sub{ font-size:11px; line-height:1.7; color:var(--ink3); }

  /* ---- 構成の絞り込み ---- */
  .cfbar{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .cfb{
    background:var(--sunken); border:1.5px solid var(--line); border-radius:20px;
    padding:7px 12px; font-family:'RocknRoll One',sans-serif; font-size:11.5px;
    color:var(--ink2); cursor:pointer;
  }
  .cfb.on{ background:var(--lime); border-color:var(--lime); color:var(--invert); }
  .cfrow{ display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .cfrow:last-child{ border-bottom:0; }
  .cfm{ font-size:12px; color:var(--ink); min-width:0; flex:1; line-height:1.6; }
  .cfv{ display:flex; align-items:baseline; gap:3px; margin-left:auto; }
  .cfv .mono{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:13px; letter-spacing:-.04em; color:var(--ink); }
  .cfv i{ font-style:normal; font-size:9.5px; color:var(--ink4); margin-right:7px; }

  /* ---- 個人／構成の切替 ---- */
  .seg{
    position:fixed; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:15;
    background:var(--ground); border-top:1px solid rgba(255,255,255,.12);
    padding:10px 0; display:flex; justify-content:center;
  }
  .seg .in{ display:flex; background:var(--sunken); border-radius:24px; padding:3px; }
  .seg button{
    display:flex; align-items:center; gap:7px; border:0; background:none; cursor:pointer;
    border-radius:22px; padding:11px 18px;
    font-family:'Dela Gothic One',sans-serif; font-size:12.5px; color:var(--ink3);
  }
  .seg button.on{ background:var(--lime); color:var(--invert); }

  /* ---- 下タブ ---- */
    /* box-sizing:border-box なので、height を固定したまま padding-bottom を足すと
       **中身がそのぶん潰れてアイコンがはみ出す。**高さ自体を伸ばす */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:16; height:calc(70px + env(safe-area-inset-bottom)); background:var(--card);
    box-shadow:0 -6px 18px rgba(0,0,0,.38); display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav .tabs{ width:100%; max-width:430px; display:flex; align-items:center; }
  nav .tab{ flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; background:none; border:0; cursor:pointer; padding:0; }
  nav .tab .lb{ font-family:'RocknRoll One',sans-serif; font-size:9.5px; color:var(--ink3); }
  nav .tab.on .inner{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--lime); border-radius:8px; padding:7px 11px 6px; transform:rotate(-1.4deg);
  }
  nav .tab.on .lb{ color:var(--invert); }
  .badge{
    position:absolute; top:-5px; right:-8px; min-width:17px; height:17px; border-radius:20px;
    background:var(--red); display:flex; align-items:center; justify-content:center; padding:0 4px;
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:9.5px; color:#fff; letter-spacing:0;
  }

  .btn{
    display:block; width:calc(100% - 36px); margin:10px 18px 0; height:48px;
    border-radius:14px; border:2px solid var(--line); background:none; color:var(--ink2);
    font-family:'RocknRoll One',sans-serif; font-size:13px; cursor:pointer;
  }
  .toast{
    position:fixed; left:50%; bottom:150px; transform:translateX(-50%); z-index:40;
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:12.5px; max-width:340px; text-align:center;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  .toast.err{ border-color:var(--red); }

  /* 地色（#241C52）や面（#332A70）と紛れないよう、ベタ塗りにする */
  .toast{
    background:var(--lime); border:0; color:var(--invert);
    font-family:'Dela Gothic One','Hiragino Sans',sans-serif; line-height:1.6;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .toast.err{ background:var(--red); color:#FFFFFF; border:0; }
  .toast .btn, .toast button{
    background:rgba(36,28,82,.14); border:0; color:var(--invert);
    font-family:'RocknRoll One',sans-serif;
  }
  .toast.err .btn, .toast.err button{ background:rgba(255,255,255,.2); color:#FFFFFF; }

  /* ---- 押した反応 ---- */
  /*
     押したのかどうか分からない、と指摘を受けた。
     スマホはマウスのような hover が無いので、**触れている間の変化**が唯一の手がかり。
     少し縮めて薄くする。形は変えないので、押し間違いを誘発しない
  */
  button:not(:disabled):active,
  .row:not(:disabled):active,
  .btn:not(:disabled):active,
  [role="button"]:active {
    transform: scale(.97);
    opacity: .78;
  }
  button, .btn, .row {
    transition: transform .07s ease, opacity .07s ease;
  }
  button:disabled, .btn:disabled {
    opacity: .5;
    cursor: default;
  }
  @media (prefers-reduced-motion: reduce){
    button:not(:disabled):active, .btn:not(:disabled):active, .row:not(:disabled):active { transform:none; }
  }

  /* === hidden を必ず効かせる ===
     ブラウザ標準の [hidden]{display:none} は**弱い**ので、
     .shotbox{display:flex} のような指定に負ける。
     「隠したのに見えている」が実際に起きた（スクショの枠が画像と二重に出た）。
     どの画面でも同じ罠があるので、まとめて塞ぐ */
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl dela">ランキング</div>
    <div class="per" id="per"></div>
  </header>
  <main id="app"></main>
  <div class="seg" id="seg" hidden></div>
  <nav><div class="tabs" id="tabbar"></div></nav>
</div>

<script>
// ===================================================================
// ランキング画面。1回の通信で 個人・表彰・構成 の3つぶんを受け取る。
// GASは1往復に数秒かかるので、指標タブの切替では通信しない。
// ===================================================================

/** サーバー（GASのWebアプリ）の住所。設定画面で上書きできる */
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxIVM6CusWbS3534Ij87AaLW25BKwh6vyLsmFj2OS1w0etmKJZODTmur27Bkm7tvo6sNA/exec';

/**
 * 保存された住所が壊れていたら使わない。
 * GASのWebアプリの住所は半角英数と - _ だけでできている。
 * 1文字でも別の文字が混ざっていたら、手入力の失敗とみなして埋め込みのほうを使う。
 */
function sanitizeGasUrl(u){
  if(!u) return '';
  var head = 'https://script.google.com/macros/s/';
  var tail = '/exec';
  if(u.indexOf(head) !== 0) return '';
  if(u.slice(-tail.length) !== tail) return '';
  var id = u.slice(head.length, u.length - tail.length);
  if(!id) return '';
  // 半角英数と - _ 以外が1文字でも混ざっていたら、手入力の失敗とみなす
  for(var i = 0; i < id.length; i++){
    var c = id.charCodeAt(i);
    var ok = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 45 || c === 95;
    if(!ok) return '';
  }
  return u;
}

const LS = { url:'apexGasUrl', key:'apexEditKey', person:'apexPersonId' };
const MEM = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return MEM[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ MEM[k] = v; } }
};


/**
 * 画面をまたいで結果を覚えておく置き場。
 * タブを切り替えるたびにGASを待つと毎回2〜3秒かかるので、前回の内容で先に描く。
 * 中身は数秒後に裏で最新へ差し替わる。
 */
// 版を上げると、古い形の控えを丸ごと無視できる。中身の作りを変えたときに使う
const CACHE_PREFIX = 'apexCache:v2:';
const CACHE_STALE_MS = 20 * 60 * 1000;        // これを超えたら「古いかも」と伝える
const CACHE_MAX_MS   = 24 * 60 * 60 * 1000;   // これを超えたら、そもそも使わない

/** いま画面に出している控えの鍵。鮮度の表示に使う */
let SHOWN_KEY = null;
/** 直近の通信が成功したか。失敗したまま古い数字を出し続けないための印 */
let NET_OK = true;

/**
 * 控えを読む。**保存した時刻も必ず見る。**
 *
 * 以前は時刻を保存していたのに読んでいなかった。そのため通信に失敗すると、
 * 何日前の数字でも現在値の顔をして出ていた（どこにも「いつのものか」が出ない）。
 */
function cacheGet(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.data) return null;
    if(typeof o.t === 'number' && Date.now() - o.t > CACHE_MAX_MS) return null;
    SHOWN_KEY = key;
    updateFreshBar();
    return o.data;
  }catch(e){ return null; }
}

/** その控えを保存してからの経過ミリ秒。分からなければ null */
function cacheAge(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && typeof o.t === 'number') ? Date.now() - o.t : null;
  }catch(e){ return null; }
}

function cacheSet(key, data){
  try{ localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), data: data })); }
  catch(e){ /* 容量超過などは無視。次回また取りに行くだけ */ }
  SHOWN_KEY = key;
  NET_OK = true;
  updateFreshBar();
}

/**
 * 「いつの数字か」の帯。
 *
 * 出すのは**困っているときだけ**にする。
 *   - 取り直せなかった（電波が無い・サーバーが落ちている）
 *   - 控えが20分より古い
 * うまくいっているときは何も出さない。常時出すと、ただの飾りになって読まれなくなる。
 */
/**
 * 控えを見せている間、**裏で最新を取りに行っていること**を出す。
 *
 * 控えがあると画面はすぐ出るが、数字が前回のままなのか最新なのかが
 * **利用者からは区別できない。**中身が変わらなければ、更新が終わっても見た目は同じ。
 * 「もう最新なのか、まだ待つのか」が分からないままだった。
 */
function showChecking(on){
  let el = document.getElementById('checking');
  if(!on){ if(el) el.remove(); return; }
  if(el) return;
  el = document.createElement('div');
  el.id = 'checking';
  el.style.cssText =
    'position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));' +
    'z-index:55;padding:7px 14px;font-size:12px;line-height:1.4;text-align:center;' +
    'background:rgba(58,42,90,.94);color:#CBBEF5;border-top:1px solid #4A3A74';
  el.textContent = '最新を確認しています…';
  document.body.appendChild(el);
}


function updateFreshBar(){
  const age = SHOWN_KEY ? cacheAge(SHOWN_KEY) : null;
  const old = age !== null && age > CACHE_STALE_MS;
  if(NET_OK && !old){ removeFreshBar(); return; }

  let el = document.getElementById('freshbar');
  if(!el){
    el = document.createElement('div');
    el.id = 'freshbar';
    el.style.cssText =
      'position:fixed;left:0;right:0;top:0;z-index:60;padding:9px 14px;' +
      'font-family:inherit;font-size:12.5px;line-height:1.5;text-align:center;' +
      'background:#3A2A1A;color:#FFE646;border-bottom:1px solid #6B4E1E';
    document.body.appendChild(el);
  }
  el.textContent = (NET_OK ? '⚠ 古い数字かもしれません' : '⚠ つながっていません') +
    '（最終更新 ' + fmtAgo(age) + '）';
  // 帯のぶんだけ本文を下げる。上に重ねるとヘッダーが隠れて操作できなくなる
  document.body.style.paddingTop = el.offsetHeight + 'px';
}

/** 経過時間を「◯分前」「◯時間前」にする。分からないときは「不明」 */
function fmtAgo(ms){
  if(ms === null || ms === undefined) return '不明';
  const m = Math.floor(ms / 60000);
  if(m < 1) return 'たった今';
  if(m < 60) return m + '分前';
  const h = Math.floor(m / 60);
  if(h < 24) return h + '時間前';
  return Math.floor(h / 24) + '日前';
}

 * 他の画面ぶんを裏で取っておく。
 * タブを初めて開くときの2〜3秒を無くすため。いま見ている画面が出てから走らせる。
 * 取れなかったら黙って諦める（次に開いたときに取りに行くだけ）。
 */
function warmOtherScreens(myPersonId){
  const jobs = [
    ['home',                       { action:'home' }],
    ['ranking:month::person',      { action:'ranking', period_kind:'month', period_value:'', axis:'person' }],
    ['circle:',                    { action:'circle' }],
    ['mypage:' + (myPersonId||''), myPersonId ? { action:'mypage', person_id:myPersonId } : { action:'mypage' }],
    ['masters',                    { action:'masters' }]
  ];
  // settings と review_list は編集キーが要る。持っていない端末では取りに行っても弾かれるだけ
  if(store.get(LS.key)){
    jobs.push(['settings',    { action:'settings' }]);
    jobs.push(['review_list', { action:'review_list' }]);
  }
  let i = 0;
  const next = () => {
    if(i >= jobs.length) return;
    const [key, params] = jobs[i++];
    // すでに新しい控えがあるなら飛ばす（5分もてば十分）
    let fresh = false;
    try{
      const raw = localStorage.getItem(CACHE_PREFIX + key);
      if(raw){ const o = JSON.parse(raw); fresh = o && (Date.now() - o.t) < 5 * 60 * 1000; }
    }catch(e){}
    if(fresh){ next(); return; }
    apiGet(params)
      .then(j => { cacheSet(key, j); })
      .catch(() => {})
      .then(() => setTimeout(next, 300));   // 1本ずつ。まとめて叩かない
  };
  setTimeout(next, 1200);   // いま見ている画面の描画を邪魔しない
}

/**
 * 読み取り。生データ（一覧・試合の詳細・画像）と運用情報はサーバー側で
 * 編集キーを要求するので、端末が持っていれば毎回付ける。
 * 集計済みの画面（ホーム・ランキング・サークル・マイページ）は鍵が無くても返る。
 */
/**
 * 読み取り。**一時的な失敗は1回だけやり直す。**
 *
 * 測定中、Googleから HTTP 404 のHTMLが実際に返ってきた。
 * 端末に控えが無い初回利用では、その1回で「つながりませんでした」になる。
 *
 * やり直すのは、届かなかった・404や5xx・JSONでない応答の3つだけ。
 * **編集キー違いなど、JSONで返った業務エラーはやり直さない**（何度やっても同じ）。
 * 1〜3秒ばらけさせて待つ。**2回目も失敗したら、そのまま伝える。**
 */
function apiGet(params){
  return apiGetOnce(params).catch(err => {
    if(!err || !err.retryable) throw err;
    const wait = 1000 + Math.floor(Math.random() * 2000);
    return new Promise(r => setTimeout(r, wait)).then(() => apiGetOnce(params));
  });
}


function apiGetOnce(params){
  const p = Object.assign({}, params);
  const k = store.get(LS.key) || '';
  if(k) p.key = k;
  const q = new URLSearchParams(p).toString();
  // 「サーバーに届かなかった」と「届いたが断られた」を分ける。
  // 前者だけがオフライン。AUTHで弾かれたのを「つながっていません」と出すと嘘になる
  return fetch(S.url + '?' + q, { method:'GET' })
    .catch(err => { NET_OK = false; updateFreshBar(); err.retryable = true; throw err; })
    .then(r => {
      if(!r.ok){
        NET_OK = false; updateFreshBar();
        const he = new Error('HTTP ' + r.status);
        // 404 と 5xx は Google 側の一時的な不調でも出る。やり直す価値がある
        he.retryable = (r.status === 404 || r.status >= 500);
        throw he;
      }
      // Googleの一時的な不調で、JSONではなくエラーページが返ることがある
      // （性能試験のあいだ、実際に何度も起きた）。読めないなら「届かなかった」扱いにする。
      // ここで r.json() を直に返すと、利用者には構文エラーがそのまま出る
      return r.text().then(t => {
        try { return JSON.parse(t); }
        catch (e) {
          NET_OK = false; updateFreshBar();
          const pe = new Error("サーバーからの応答を読めませんでした");
          pe.retryable = true;
          throw pe;
        }
      });
    })
    .then(j => {
      NET_OK = true; updateFreshBar();
      if(!j.ok){
        const e = new Error(j.error || '取得に失敗しました');
        e.code = j.code || '';
        throw e;
      }
      return j;
    });
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function toast(msg, isError){
  const old = document.getElementById('toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast'; t.className = 'toast' + (isError ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t);
  if(!isError) setTimeout(() => t.remove(), 2200);
}

/** 指標ごとに桁と単位が違う。—は「まだ出せない」 */
function fmt(v, digits, unit){
  if(v === null || v === undefined) return '—';
  const n = Number(v);
  const s = digits > 0 ? n.toFixed(digits) : Math.round(n).toLocaleString('ja-JP');
  return s + (unit || '');
}
function fmtSec(v){
  if(v === null || v === undefined) return '—';
  const s = Math.round(Number(v));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// 個人ランキング
// ===================================================================
function renderPerson(){
  const d = S.data;
  const met = (d.metrics || []).find(m => m.id === S.metric) || (d.metrics || [])[0];
  if(!met) return '<div class="card">指標がありません</div>';

  const tabs = '<div class="mtabs">' + (d.metrics || []).map(m =>
    '<button class="mtab' + (m.id === S.metric ? ' on' : '') + '" data-m="' + m.id + '">' + esc(m.label) + '</button>'
  ).join('') + '</div>';

  const subs = (d.subjects || []).slice();
  if(!subs.length){
    return chips() + tabs + '<div class="card" style="margin-top:16px">' +
      '<div class="dela" style="font-size:15px">この期間に確定した試合がありません</div>' +
      '<div class="sub" style="margin-top:9px">登録タブでスクショを確認して確定すると、ここに出ます。</div></div>';
  }

  // 値が無い人（率が出せない）は末尾へ
  subs.sort((x, y) => {
    const vx = x[met.id], vy = y[met.id];
    if(vx === null && vy === null) return 0;
    if(vx === null) return 1;
    if(vy === null) return -1;
    return (vy - vx) * met.dir;
  });

  const max = Math.max.apply(null, subs.map(s => Number(s[met.id]) || 0).concat([0])) || 1;

  // 率の指標（1位率・5位以内率）は「順位が読めた試合」でしか割れない。
  // 出場試合数で規定を見ると、順位が1件しか読めていない人が100%で1位になる
  const useRate = met.denom === 'placed_games';
  const denomOf = s => useRate ? (s.placed_games || 0) : (s.games || 0);
  const okOf = s => useRate ? !!s.qualified_rate : !!s.qualified;

  const rows = subs.map((s, i) => {
    const v = s[met.id];
    const pct = (v === null || v === undefined) ? 0 : Math.max(2, Math.round((Number(v) / max) * 100));
    const ok = okOf(s);
    const top = i === 0 && ok;
    const barColor = !ok ? 'var(--ink4)' : (i === 0 ? 'var(--lime)' : 'var(--purple)');
    const why = ok ? '' :
      '<div class="why">' +
      (useRate
        ? '順位が読めた試合が <span class="mono" style="font-size:11.5px;color:var(--ink2)">' + denomOf(s) +
          '試合</span> しかありません。規定の ' + d.min_games + '試合に届いていないので、月間表彰の対象外です。'
        : '規定の <span class="mono" style="font-size:11.5px;color:var(--ink2)">' + d.min_games +
          '試合</span> に届いていないので、月間表彰の対象外です。') +
      '数字はふつうに見られます。</div>';
    return '<div class="rrow' + (ok ? '' : ' off') + '">' +
      '<div class="rhead">' +
        '<div class="rno' + (top ? ' top' : '') + '"><span>' + (i + 1) + '</span></div>' +
        '<span class="rname">' + esc(s.name) + '</span>' +
        '<div class="rval"><b>' + fmt(v, met.digits, met.unit) + '</b><i>' + denomOf(s) + '戦</i></div>' +
      '</div>' +
      '<div class="track"><div style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      why +
    '</div>';
  }).join('');

  // 月間表彰への入口。その月の最初の1週間だけ黄で目立たせる
  const hot = isAwardWeek();
  const titles = (d.awards || []).map(a => a.title).join('・');
  const entry = '<button class="toAwards ' + (hot ? 'hot' : 'cool') + '" id="toAwards">' +
    '<div><div class="dela" style="font-size:13.5px">' + esc(d.period.label) + 'の表彰' + (hot ? 'が決まりました' : 'を見る') + '</div>' +
    '<div style="font-size:10.5px;margin-top:3px;color:' + (hot ? 'rgba(36,28,82,.72)' : 'var(--ink3)') + '">' + esc(titles) + '</div></div>' +
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="' + (hot ? '#241C52' : '#C6BCF2') + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h13"></path><path d="M12.5 6.5L19 12l-6.5 5.5"></path></svg>' +
  '</button>';

  // 指標で変わるのはここから下だけ。
  // 期間チップと指標バーまで一緒に動かすと、
  // **変わっていないものまで変わったように見える**
  return chips() + tabs +
    '<div id="swipe"><div style="height:16px"></div>' + rows + entry + '<div style="height:24px"></div></div>';
}

  const cards = cs.map(c => {
    const val = (c.id === 'survival') ? fmtSec(c.value) : fmt(c.value, c.digits, '');
    const unit = (c.id === 'survival') ? '' : (c.unit ? '<small>' + esc(c.unit) + '</small>' : '');
    const mem = (c.members || []).map(m =>
      '<div class="mem"><span class="lg">' + esc(m.legend_name) + '</span>' +
      '<span class="pn">' + esc(m.person_name || '—') + (m.shared ? ' ほか' : '') + '</span></div>').join('');
    // 同点の構成があるときは、そちらも並べる（1つだけ出すと集計順で決まってしまう）
    const others = (c.others || []).map(o =>
      '<div class="cother">同点 ' +
        (o.members || []).map(m => esc(m.legend_name)).join(' / ') +
        ' <span class="mono" style="font-size:10.5px">' + o.games + '戦</span></div>').join('');
    return '<div class="compo">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">' +
        '<div class="ct">' + esc(c.title) +
          (c.tied ? '<span style="color:var(--yellow);margin-left:6px">同点</span>' : '') + '</div>' +
        (c.badge ? '<span class="cbadge">' + esc(c.badge) + '</span>' : '') +
      '</div>' +
      '<div class="cv">' + val + unit + '</div>' +
      mem + others +
      (c.id === 'games' && !c.note ? '' :
        '<div class="cg"><span>' + (c.note ? esc(c.note) : '') + '</span>' +
        '<span class="mono" style="font-size:11.5px;color:var(--ink2)">' + c.games + '戦</span></div>') +
    '</div>';
  }).join('');

  return chips() + head + cards + compoFilter(d) + '<div style="height:24px"></div>';
}

/**
 * 「このレジェンドを入れた構成はどうなのか」を見る絞り込み。
 *
 * 部門の1位（上のカード）だけだと「勝ってる構成」しか見えない。
 * 自分がよく使うレジェンドを選んで、その構成の実際の成績を見られるようにする。
 * 2体まで選べる（3体選ぶと構成が1つに決まってしまい、絞り込む意味がない）。
 */
function compoFilter(d){
  const all = d.compo_list || [];
  if(!all.length) return '';

  // 一覧に出てくるレジェンドだけを候補にする。使ったことのない体を並べても選べない
  const seen = {};
  all.forEach(c => (c.members || []).forEach(m => { seen[m.legend_id] = m.legend_name; }));
  const opts = Object.keys(seen).map(id => ({ id, name: seen[id] }))
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  const picked = S.compoPick || [];
  const hit = picked.length
    ? all.filter(c => picked.every(p => (c.legend_ids || []).indexOf(p) >= 0))
    : all;

  const buttons = opts.map(o =>
    '<button class="cfb' + (picked.indexOf(o.id) >= 0 ? ' on' : '') + '" data-cf="' + esc(o.id) + '">' +
      esc(o.name) + '</button>').join('');

  const rows = hit.slice(0, 20).map(c =>
    '<div class="cfrow">' +
      '<div class="cfm">' + (c.members || []).map(m => esc(m.legend_name)).join(' / ') + '</div>' +
      '<div class="cfv">' +
        '<span class="mono">' + c.games + '</span><i>戦</i>' +
        '<span class="mono">' + (c.avg_place === null ? '—' : c.avg_place.toFixed(1)) + '</span><i>位</i>' +
        '<span class="mono">' + Math.round(c.avg_damage || 0) + '</span><i>ダメ</i>' +
      '</div>' +
    '</div>').join('');

  return '<div class="sec">構成でしぼる</div>' +
    '<div class="card"><div class="sub">レジェンドを<b style="color:var(--ink2)">2体まで</b>選ぶと、' +
      'それを含む構成だけを出します。もう一度押すと外れます。</div>' +
      '<div class="cfbar">' + buttons + '</div></div>' +
    (hit.length
      ? '<div class="card" style="margin-top:8px">' + rows +
        (hit.length > 20 ? '<div class="sub" style="margin-top:8px">ほか' + (hit.length - 20) + '件</div>' : '') +
        '</div>'
      : '<div class="card" style="margin-top:8px"><div class="sub">' +
        'その組み合わせで <span class="mono" style="color:var(--ink2)">' + d.compo_min_games +
        '戦</span> 以上たまった構成はまだありません。</div></div>');
}

// ===================================================================
// 描画
// ===================================================================
// ===================================================================
// 横スワイプ
// ===================================================================
//
// === なぜ要るのか ===
//
// 指標を変えるボタンは画面のいちばん上にある。**スマホを片手で持つと、
// 親指はそこまで届かない。**反対の手を使うことになり、
// 「出場試合数」に至っては、バーを横に送ってから押す必要がある。
//
// 画面のどこを雑に横へ払っても指標が変わるようにする。
//
// === 気をつけたこと ===
//
// 1. **縦スクロールを壊さない。** 横に払ったと判断できるまで手を出さない。
// 2. **指標バー自身の横スクロールを奪わない。** バーの上から始まった指は素通しする。
// 3. **押すつもりの指を横移動と誤解しない。** 動いた距離が小さいうちは何もしない。

/** 横に払ったと認める距離（px） */
var SWIPE_MIN = 45;
/** 縦より横が勝っていると認める比 */
var SWIPE_RATIO = 1.4;
/** 指に追従させる量。1.0だと軽すぎて誤爆するので少し重くする */
var SWIPE_FOLLOW = 0.42;

/**
 * 横スワイプを付ける。
 *
 * @param {Element} zone      指を受ける範囲
 * @param {Function} moveEl   動かす要素を返す（毎回取り直す。描き直しで別物になるため）
 * @param {Function} onSwipe  (dir) dir は -1(左へ払った=次) / +1(右へ払った=前)
 * @param {Function} [skip]   true を返したら、その指は無視する
 */
function attachSwipe(zone, moveEl, onSwipe, skip){
  var x0 = 0, y0 = 0, dx = 0, active = false, decided = false, ignore = false;

  var el = function(){ try { return moveEl(); } catch(e){ return null; } };

  var setX = function(px, animate){
    var m = el(); if(!m) return;
    m.classList.toggle('sliding', !!animate);
    m.classList.toggle('moving', !!px);      // 動かす間だけ合成レイヤーに乗せる
    m.style.transform = px ? ('translateX(' + px + 'px)') : '';
    if(m.id === 'swipe') m.style.opacity = px ? String(Math.max(.55, 1 - Math.abs(px) / 260)) : '';
  };

  var reset = function(){
    var m = el();
    if(m){ m.classList.remove('sliding'); m.classList.remove('moving'); m.style.transform = ''; m.style.opacity = ''; }
    active = decided = ignore = false; dx = 0;
    // 幻の横幅へ何かがスクロールしていたら戻す。
    // body は overflow-x:hidden なので、指では戻せない
    try {
      var se = document.scrollingElement || document.documentElement;
      if (se && se.scrollLeft) se.scrollLeft = 0;
    } catch(e){}
  };

  zone.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ ignore = true; return; }
    // 指標バーの上から始まった指は、バー自身の横スクロールのもの
    ignore = !!(skip && skip(e.target));
    if(ignore) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dx = 0; active = true; decided = false;
  }, { passive: true });

  zone.addEventListener('touchmove', function(e){
    if(!active || ignore) return;
    var mx = e.touches[0].clientX - x0;
    var my = e.touches[0].clientY - y0;

    if(!decided){
      // まだどちらとも言えないうちは何もしない。**縦スクロールが最優先**
      if(Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      if(Math.abs(mx) < Math.abs(my) * SWIPE_RATIO){ active = false; return; }  // 縦だった
      decided = true;
    }
    dx = mx;
    setX(dx * SWIPE_FOLLOW, false);
    // 横だと決まった以上、ブラウザに横をやらせない
    if(e.cancelable) e.preventDefault();
  }, { passive: false });

  var end = function(){
    if(!active || ignore){ reset(); return; }
    var d = dx;
    active = false;
    if(!decided || Math.abs(d) < SWIPE_MIN){ setX(0, true); setTimeout(reset, 200); return; }
    onSwipe(d < 0 ? -1 : 1, function(ok){
      var m = el(); if(!m){ reset(); return; }
      if(!ok){
        // 端まで来ていた。跳ね返して「これ以上ない」と伝える
        setX(0, true);
        m.style.setProperty('--nx', (d < 0 ? -14 : 14) + 'px');
        m.classList.add('nudge');
        setTimeout(function(){ m.classList.remove('nudge'); reset(); }, 240);
      } else {
        reset();
      }
    });
  };

  zone.addEventListener('touchend', end, { passive: true });
  zone.addEventListener('touchcancel', function(){ setX(0, true); setTimeout(reset, 200); }, { passive: true });
}

/**
 * 選ばれているチップが見えるよう、**バーだけ**を横へ動かす。
 * scrollIntoView は先祖を全部動かすので使わない。
 */
function scrollMetricBarIntoView(){
  var bar = document.querySelector('.mtabs');
  var on  = bar && bar.querySelector('.mtab.on');
  if(!bar || !on) return;

  // offsetLeft は使わない。.mtabs に position が無いので、
  // 基準が body になってしまう（実測で確認）。
  var br = bar.getBoundingClientRect();
  var cr = on.getBoundingClientRect();

  // === 中央に持ってこない ===
  //
  // はじめは選ばれたチップを中央へ寄せていたが、
  // **それだと毎回大きく動く（実測で 93px 動いた回があった）。**
  // 目で追えない速さになり、滑らかさが失われる。
  //
  // 見えているなら**動かさない。**
  // 見えていないときだけ、見えるだけ動かす。
  var PEEK = 26;      // 端に残す余白。次のチップの端が覗くので「まだ先がある」と分かる

  var to = bar.scrollLeft;
  var overRight = cr.right - (br.right - PEEK);
  var overLeft  = (br.left + PEEK) - cr.left;

  if(overRight > 0)      to = bar.scrollLeft + overRight;
  else if(overLeft > 0)  to = bar.scrollLeft - overLeft;
  else                   return;                        // 見えている。動かさない

  var max = Math.max(0, bar.scrollWidth - bar.clientWidth);
  to = Math.max(0, Math.min(max, Math.round(to)));
  if(Math.abs(to - bar.scrollLeft) < 1) return;

  animateBarScroll_(bar, to);
}

/**
 * バーを動かす速さ（px/ミリ秒）と、時間の下限・上限。
 *
 * 固定時間にすると、**短い移動は遅すぎ、長い移動は速すぎる。**
 * 速さを揃えれば、どの段でも同じ進み方に見える。
 */
var BAR_SPEED_    = 0.18;   // 1ミリ秒あたり何px進むか（小さいほどゆっくり）
var BAR_MS_MIN_   = 220;    // どんなに短い移動でもこれより速くしない
var BAR_MS_MAX_   = 560;

/**
 * バーを滑らかに横へ動かす。
 *
 * === なぜ自分で動かすのか ===
 *
 * はじめは `scrollTo({behavior:'smooth'})` に任せていたが、
 * **この環境ではまったく効かなかった。**
 * 実測で t=452ms まで 0 のまま、t=477ms で 157 へ一気に飛んでいた
 * （動かなかったときの保険として入れた即値代入が、毎回仕事をしていた）。
 *
 * ブラウザの実装に頼らず、中身の動きと同じ長さ・同じ曲がり方で揃える。
 */
function animateBarScroll_(bar, to){
  var from = bar.scrollLeft;
  var dist = to - from;
  if(Math.abs(dist) < 1) return;

  // 動きを減らす設定の人には動かさない
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm){ bar.scrollLeft = to; return; }

  // 途中で次のスワイプが来たら、古い動きは捨てる
  var token = (bar.__barAnim || 0) + 1;
  bar.__barAnim = token;

  // 距離に応じて長さを決める。速さが揃うので段によるムラが出ない
  var ms = Math.max(BAR_MS_MIN_, Math.min(BAR_MS_MAX_, Math.abs(dist) / BAR_SPEED_));

  var t0 = null, done = false;
  // === 静かに出て、静かに止まる ===
  //
  // はじめは ease-out（三次）だったが、あれは**動き出しがいちばん速い。**
  // 同じ距離・同じ時間でも、瞬間の速さは平均の3倍になる（実測 1.02 px/ミリ秒）。
  // これが「パッと動く」正体だった。
  //
  // smoothstep は両端で速さが 0 になる。最速は真ん中で平均の1.5倍だけ。
  var ease = function(t){ return t * t * (3 - 2 * t); };   // 両端がなめらか
  var step = function(ts){
    if(bar.__barAnim !== token || !bar.isConnected) return;   // 描き直されたならやめる
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0) / ms);
    bar.scrollLeft = from + dist * ease(p);
    if(p < 1) requestAnimationFrame(step);
    else done = true;
  };
  requestAnimationFrame(step);

  // === 保険 ===
  //
  // requestAnimationFrame は**画面が見えていないと周ってこない。**
  // スワイプの途中で他のアプリへ移ると、
  // バーが途中で止まったままになる。
  // 滑らかさより、**最後に正しい位置でいること**の方が大事。
  setTimeout(function(){
    if(done || bar.__barAnim !== token || !bar.isConnected) return;
    bar.scrollLeft = to;
  }, ms + 400);
}

/** いまの指標の並び順での位置 */
function metricIndex(){
  var ms = (S.data && S.data.metrics) || [];
  for(var i = 0; i < ms.length; i++) if(ms[i].id === S.metric) return i;
  return 0;
}

/** 指標を1つ動かす。動かせたら true */
function stepMetric(dir){
  var ms = (S.data && S.data.metrics) || [];
  if(ms.length < 2) return false;
  // 左へ払う(dir=-1) = 次を見たい
  var next = metricIndex() + (dir < 0 ? 1 : -1);
  if(next < 0 || next >= ms.length) return false;
  S.metric = ms[next].id;
  return true;
}

/**
 * 指標を変えて、流れるように差し替える。
 *
 * 中身を入れ替えてから逆側に置き、1コマ待って0へ戻す。
 * **1コマ待たないと、置いた瞬間から0へ戻る扱いになって動きが出ない。**
 */
function slideMetric(dir, done){
  var m = document.getElementById('swipe');
  if(!m || !stepMetric(dir)){ done(false); return; }

  var w = Math.min(window.innerWidth || 380, 430);
  m.classList.add('sliding');
  m.style.transform = 'translateX(' + (dir < 0 ? -w * .5 : w * .5) + 'px)';
  m.style.opacity = '0';

  setTimeout(function(){
    render();                                  // ここで #swipe は別物に変わる
    var n = document.getElementById('swipe');
    if(!n){ done(true); return; }
    n.classList.remove('sliding');
    n.style.transform = 'translateX(' + (dir < 0 ? w * .38 : -w * .38) + 'px)';
    n.style.opacity = '0';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        n.classList.add('sliding');
        n.style.transform = '';
        n.style.opacity = '';
        setTimeout(function(){ n.classList.remove('sliding'); }, 220);
      });
    });
    // 選ばれている指標が見えないと、どこにいるのか分からなくなる。
    //
    // **scrollIntoView は使わない。**
    // あれは「見える位置まで先祖を全部スクロールする」命令なので、
    // ページ自体を横へ動かしてしまう（実機で実際に起きた）。
    // バーの scrollLeft を直接書けば、他は絶対に動かない。
    scrollMetricBarIntoView();
    done(true);
  }, 150);
}

/** 個人 ⇔ 構成 を1つ動かす */
function slideView(dir, done){
  var order = ['person', 'compo'];
  var at = order.indexOf(S.view);
  if(at < 0){ done(false); return; }          // 表彰を見ている最中は動かさない
  var next = at + (dir < 0 ? 1 : -1);
  if(next < 0 || next >= order.length){ done(false); return; }
  S.view = order[next];
  render();
  window.scrollTo({ top: 0 });
  done(true);
}

function initSwipe(){
  // 本文。指標を変える
  attachSwipe(
    app,
    function(){ return document.getElementById('swipe'); },
    function(dir, done){
      if(S.view !== 'person'){ done(false); return; }   // 構成・表彰では指標が無い
      slideMetric(dir, done);
    },
    function(target){
      // 指標バーの上から始まった指は、バー自身のもの
      return !!(target && target.closest && target.closest('.mtabs'));
    }
  );

  // 下のバー。個人 ⇔ 構成
  attachSwipe(
    segEl,
    function(){ return segEl.querySelector('.in'); },
    function(dir, done){ slideView(dir, done); }
  );
}

function render(){
  const d = S.data;
  perEl.textContent = d ? d.period.label : '';
  renderTabs();
  renderSeg();

  if(S.view === 'awards')      app.innerHTML = renderAwards();
  else if(S.view === 'compo')  app.innerHTML = renderCompo();
  else                         app.innerHTML = renderPerson();

  bindChips();
  app.querySelectorAll('[data-cf]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.cf;
      const cur = S.compoPick.slice();
      const at = cur.indexOf(id);
      if(at >= 0) cur.splice(at, 1);
      else if(cur.length < 2) cur.push(id);
      else { toast('選べるのは2体までです'); return; }
      S.compoPick = cur;
      render();
    };
  });
  app.querySelectorAll('.mtab[data-m]').forEach(b => {
    b.onclick = () => { S.metric = b.dataset.m; render(); };
  });
  const ta = document.getElementById('toAwards');
  if(ta) ta.onclick = () => { S.view = 'awards'; render(); window.scrollTo({ top: 0 }); };
  const bk = document.getElementById('backToRank');
  if(bk) bk.onclick = () => { S.view = 'person'; render(); window.scrollTo({ top: 0 }); };
  app.querySelectorAll('[data-month]').forEach(b => {
    b.onclick = () => { S.periodKind = 'month'; S.periodValue = b.dataset.month; load(); };
  });
}

// ===================================================================
// 通信
// ===================================================================
async function load(){
  const ck = 'ranking:' + S.periodKind + ':' + S.periodValue + ':' + S.axis;
  const cached = cacheGet(ck);
  if(cached){
    S.data = cached;
    S.periodKind = cached.period.kind; S.periodValue = cached.period.value;
    render();
    showChecking(true);          // 裏で最新を取りに行っていることを見せる
  }else{
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">サーバーに聞いています…</div>' +
      '<div class="sub" style="margin-top:8px">数秒かかります。そのままお待ちください。</div></div>';
    segEl.hidden = true;
  }
  try{
    // === ランキングを先に完成させる ===
    //
    // 以前は Promise.all で home と同時に取っていたので、
    // **ランキングの表示が home の遅さに引きずられて**いた。
    // 同時に2本のGAS実行を始める負荷も掛かる。
    //
    // 登録タブのバッジ（未処理の件数）は、後から差し替えれば足りる。
    const d = await apiGet({ action:'ranking', period_kind:S.periodKind, period_value:S.periodValue, axis:S.axis });
    S.data = d;
    S.periodKind = d.period.kind;
    S.periodValue = d.period.value;
    cacheSet(ck, d);
    render();
    showChecking(false);         // ここで「最新に変わった」

    // バッジだけ後から。**変わったときしか描き直さない**（点滅を避ける）
    apiGet({ action:'home' })
      .then(h => {
        const n = (h && h.pending) || 0;
        if(n !== S.pending){ S.pending = n; render(); }
      })
      .catch(() => {});

    warmOtherScreens(store.get(LS.person));
  }catch(e){
    showChecking(false);
    if(cached) return;
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">つながりませんでした</div>' +
      '<div class="sub" style="margin-top:9px">' + esc(e.message) + '</div></div>' +
      '<button class="btn" id="again">もう一度ためす</button>';
    document.getElementById('again').onclick = load;
  }
}

function boot(){
  renderTabs();
  initSwipe();   // 指を受ける側は一度付ければよい。
                 // 動かす側は描き直しで別物になるので、その都度取り直している
  if(!S.url){
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">まず接続先を教えてください</div>' +
      '<div class="sub" style="margin-top:9px">この端末はまだサーバーの場所を知りません。<br>' +
      '<span style="color:var(--lime)">登録タブ</span>でWebアプリのURLを保存すると、ここに戦績が出ます。</div></div>' +
      '<button class="btn" id="go" style="border-color:var(--lime);color:var(--lime)">登録タブをひらく</button>';
    document.getElementById('go').onclick = () => { location.href = '../record/'; };
    return;
  }
  load();
}

boot();
</script>

<script>
// ホーム画面のアイコンから開けるようにする。電波が悪くても画面自体は出る。
// 数字の控えは画面側（localStorage）が持っているので、ここでは触らない。
if ('serviceWorker' in navigator) {
