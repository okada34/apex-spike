<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サークル｜Apexサークル戦績</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#241C52">
<link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サークル戦績">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#241C52; --card:#332A70; --sunken:#2E2559; --line:#493D96; --dim:#3B3178;
    --purple:#7C5CFF; --yellow:#FFE646; --lime:#C8FF00; --red:#FF5470;
    --ink:#FFFFFF; --ink2:#C6BCF2; --ink3:#A99CE0; --ink4:#8478C4; --invert:#241C52;
    --limeDark:#9CC700;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; padding:0; background:var(--ground); color:var(--ink);
    font-family:'RocknRoll One','Hiragino Sans','Yu Gothic',sans-serif;
    font-size:14px; line-height:1.7; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  .dela{ font-family:'Dela Gothic One','Hiragino Sans',sans-serif; font-weight:400; }
  .mono{ font-family:'Roboto Mono',ui-monospace,monospace; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
         padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  main{ flex:1; padding-bottom:14px; }

  header{
    position:sticky; top:0; z-index:20; background:var(--ground);
    padding:16px 18px 12px; display:flex; align-items:center; gap:11px;
  }
  header .ttl{ font-family:'Dela Gothic One',sans-serif; font-size:17px; }
  .iconbtn{ background:none; border:0; padding:6px; display:flex; align-items:center; cursor:pointer; }
  .saving{ font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink3); margin-left:auto; }

  /* ---- 目標の黄カード ---- */
  .goal{ margin:0 18px; background:var(--yellow); border-radius:18px; padding:17px 17px 16px; color:var(--invert); }
  .goal .gh{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .goal .gt{ font-family:'Dela Gothic One',sans-serif; font-size:15px; }
  .goal .gs{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:10px; color:rgba(36,28,82,.6); letter-spacing:-.04em; }
  .gvals{ display:flex; align-items:flex-end; gap:18px; margin-top:12px; }
  .gv .gl{ font-size:10.5px; color:rgba(36,28,82,.72); }
  .gv .gn{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.04em; }
  .gv .gn small{ font-family:'RocknRoll One',sans-serif; font-size:12px; font-weight:400; letter-spacing:0; margin-left:2px; }
  .gv.sub .gn{ font-size:20px; color:rgba(36,28,82,.66); }
  .gright{ margin-left:auto; text-align:right; }
  .gright .a{ font-size:10px; color:rgba(36,28,82,.6); }
  .gright .b{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:14px; color:rgba(36,28,82,.78); letter-spacing:-.04em; }

  .thr{ position:relative; height:17px; margin-top:15px; }
  .thr span{ position:absolute; transform:translateX(-50%); font-family:'Roboto Mono',monospace; font-weight:700; font-size:12px; color:rgba(36,28,82,.55); letter-spacing:-.04em; }
  /* 地色はバーの帯だけ。ここを抜くと3段目の黄が背景に溶ける */
  .barbox{ background:var(--ground); border-radius:9px; padding:4px; margin-top:3px; }
  .bar{ display:flex; gap:5px; height:22px; }
  .bar .z{ flex:1; background:var(--sunken); border-radius:6px; overflow:hidden; }
  .bar .z i{ display:block; height:100%; border-radius:6px; }
  .zlabels{ display:flex; gap:5px; margin-top:8px; }
  .zlabels div{ flex:1; text-align:center; font-family:'Dela Gothic One',sans-serif; font-size:11px; color:rgba(36,28,82,.4); }
  .zlabels div.on{ color:var(--invert); }
  .gmsg{ font-size:12.5px; line-height:1.7; margin-top:12px; }
  .gmsg b{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; letter-spacing:-.04em; }

  .goalEditBtn{ display:flex; justify-content:flex-end; margin:16px 18px 0; }
  .goalEditBtn button{
    background:var(--yellow); border:0; border-radius:14px; padding:11px 16px; cursor:pointer;
    transform:rotate(-1.4deg); display:flex; align-items:center; gap:7px;
    font-family:'Dela Gothic One',sans-serif; font-size:13px; color:var(--invert);
  }

  /* ---- メンバー ---- */
  .sechead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 18px 11px; }
  .sechead .t{ font-family:'Dela Gothic One',sans-serif; font-size:15px; }
  .sechead .n{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:11px; color:var(--ink2); letter-spacing:-.04em; }

  .mem{ background:var(--card); border-radius:18px; padding:15px; margin:0 18px 10px; }
  .mem .mh{ display:flex; align-items:baseline; gap:10px; }
  .mem .mn{ font-family:'Dela Gothic One',sans-serif; font-size:17px; }
  .mem .mg{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:12px; color:var(--ink3); letter-spacing:-.04em; margin-left:auto; }
  .mblk{ margin-top:12px; }
  .mblk .bl{ font-size:10.5px; color:var(--ink4); }
  .chips2{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .lchip{ background:var(--sunken); border-radius:20px; padding:5px 11px; font-size:11.5px; color:var(--ink2); }
  .wrow{ display:flex; align-items:baseline; gap:9px; margin-top:6px; }
  .wrow .wc{ font-size:10.5px; color:var(--ink4); flex:none; width:96px; }
  .wrow .wn{ font-size:12.5px; }
  .mnote{ font-size:11.5px; color:var(--ink2); margin-top:12px; padding-top:11px; border-top:1px solid var(--line); }
  .mnote.empty{ color:var(--ink4); }
  .medit{ margin-top:11px; }
  .medit button{
    background:none; border:1.5px solid var(--line); border-radius:12px; padding:8px 14px; cursor:pointer;
    font-family:'RocknRoll One',sans-serif; font-size:11.5px; color:var(--ink2);
  }

  /* ---- 共通 ---- */
  .card{ background:var(--card); border-radius:18px; padding:15px; margin:0 18px 10px; }
  .sec{ font-family:'Dela Gothic One',sans-serif; font-size:15px; margin:26px 18px 11px; }
  .sub{ font-size:11px; line-height:1.7; color:var(--ink3); }
  .btn{
    display:block; width:calc(100% - 36px); margin:12px 18px 0; height:50px;
    border-radius:14px; border:2px solid var(--line); background:none; color:var(--ink2);
    font-family:'RocknRoll One',sans-serif; font-size:13px; cursor:pointer;
  }
  .btn.solid{ background:var(--lime); border-color:var(--lime); color:var(--invert); font-family:'Dela Gothic One',sans-serif; }
  .btn.ghost{ border-color:var(--line); }
  .fld{ margin-top:14px; }
  .fld label{ display:block; font-size:11px; color:var(--ink3); margin-bottom:6px; }
  .fld input{
    width:100%; height:46px; background:var(--sunken); border:1.5px solid var(--line); border-radius:12px;
    color:var(--ink); padding:0 13px; font-family:'RocknRoll One',sans-serif; font-size:14px; outline:none;
  }
  .fld input.num{ font-family:'Roboto Mono',monospace; font-weight:700; letter-spacing:-.04em; }
  .fld input:focus{ border-color:var(--purple); }
  .row3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
  .row2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }

  /* ---- 武器選び ---- */
  .wcat{ margin:18px 18px 8px; display:flex; align-items:baseline; gap:9px; }
  .wcat .t{ font-family:'Dela Gothic One',sans-serif; font-size:13px; }
  .wcat .n{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:10.5px; color:var(--ink4); letter-spacing:-.04em; }
  .wgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0 18px; }
  .wbtn{
    background:var(--card); border:1.5px solid transparent; border-radius:12px; padding:12px 10px; cursor:pointer;
    font-family:'RocknRoll One',sans-serif; font-size:12.5px; color:var(--ink); text-align:center; min-height:46px;
  }
  .wbtn.on{ background:var(--purple); border-color:var(--purple); }
  .wbtn:disabled{ opacity:.34; cursor:default; }
  .slot{ display:flex; align-items:center; gap:10px; background:var(--card); border-radius:14px; padding:12px 14px; margin:0 18px 8px; }
  .slot .sl{ font-size:10.5px; color:var(--ink4); flex:none; width:104px; }
  .slot .sn{ font-size:13px; }
  .slot .sn.empty{ color:var(--ink4); }
  .slot button{ margin-left:auto; background:none; border:0; color:var(--ink3); font-size:16px; cursor:pointer; padding:4px 8px; }

  /* ---- 履歴 ---- */
  .hist{ font-size:11px; line-height:1.9; color:var(--ink3); }
  .hist b{ color:var(--ink2); font-weight:400; }

  /* ---- 下タブ ---- */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:16; height:70px; background:var(--card);
    box-shadow:0 -6px 18px rgba(0,0,0,.38); display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav .tabs{ width:100%; max-width:430px; display:flex; align-items:center; }
  nav .tab{ flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; background:none; border:0; cursor:pointer; padding:0; }
  nav .tab .lb{ font-family:'RocknRoll One',sans-serif; font-size:9.5px; color:var(--ink3); }
  nav .tab.on .inner{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--lime); border-radius:8px; padding:7px 11px 6px; transform:rotate(-1.4deg);
  }
  nav .tab.on .lb{ color:var(--invert); }
  .badge{
    position:absolute; top:-5px; right:-8px; min-width:17px; height:17px; border-radius:20px;
    background:var(--red); display:flex; align-items:center; justify-content:center; padding:0 4px;
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:9.5px; color:#fff; letter-spacing:0;
  }
  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:40;
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:12.5px; max-width:340px; text-align:center;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  .toast.err{ border-color:var(--red); }

  /* 地色（#241C52）や面（#332A70）と紛れないよう、ベタ塗りにする */
  .toast{
    background:var(--lime); border:0; color:var(--invert);
    font-family:'Dela Gothic One','Hiragino Sans',sans-serif; line-height:1.6;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .toast.err{ background:var(--red); color:#FFFFFF; border:0; }
  .toast .btn, .toast button{
    background:rgba(36,28,82,.14); border:0; color:var(--invert);
    font-family:'RocknRoll One',sans-serif;
  }
  .toast.err .btn, .toast.err button{ background:rgba(255,255,255,.2); color:#FFFFFF; }
</style>

<body>
<div class="wrap">
  <header>
    <button class="iconbtn" id="back" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C6BCF2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div class="ttl dela" id="title">サークル</div>
    <div class="saving" id="savestate"></div>
  </header>
  <main id="app"></main>
  <nav><div class="tabs" id="tabbar"></div></nav>
</div>

<script>
// ===================================================================
// サークル画面。目標の進み具合と、メンバー4人の紹介。
// 武器と一言はリザルト画面から取れないので自己申告。
// ===================================================================

/** サーバー（GASのWebアプリ）の住所。設定画面で上書きできる */
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxIVM6CusWbS3534Ij87AaLW25BKwh6vyLsmFj2OS1w0etmKJZODTmur27Bkm7tvo6sNA/exec';

/**
 * 保存された住所が壊れていたら使わない。
 * GASのWebアプリの住所は半角英数と - _ だけでできている。
 * 1文字でも別の文字が混ざっていたら、手入力の失敗とみなして埋め込みのほうを使う。
 */
function sanitizeGasUrl(u){
  if(!u) return '';
  var head = 'https://script.google.com/macros/s/';
  var tail = '/exec';
  if(u.indexOf(head) !== 0) return '';
  if(u.slice(-tail.length) !== tail) return '';
  var id = u.slice(head.length, u.length - tail.length);
  if(!id) return '';
  // 半角英数と - _ 以外が1文字でも混ざっていたら、手入力の失敗とみなす
  for(var i = 0; i < id.length; i++){
    var c = id.charCodeAt(i);
    var ok = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 45 || c === 95;
    if(!ok) return '';
  }
  return u;
}

const LS = { url:'apexGasUrl', key:'apexEditKey', person:'apexPersonId' };
const MEM = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return MEM[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ MEM[k] = v; } }
};


/**
 * 画面をまたいで結果を覚えておく置き場。
 * タブを切り替えるたびにGASを待つと毎回2〜3秒かかるので、前回の内容で先に描く。
 * 中身は数秒後に裏で最新へ差し替わる。
 */
// 版を上げると、古い形の控えを丸ごと無視できる。中身の作りを変えたときに使う
const CACHE_PREFIX = 'apexCache:v2:';
const CACHE_STALE_MS = 20 * 60 * 1000;        // これを超えたら「古いかも」と伝える
const CACHE_MAX_MS   = 24 * 60 * 60 * 1000;   // これを超えたら、そもそも使わない

/** いま画面に出している控えの鍵。鮮度の表示に使う */
let SHOWN_KEY = null;
/** 直近の通信が成功したか。失敗したまま古い数字を出し続けないための印 */
let NET_OK = true;

/**
 * 控えを読む。**保存した時刻も必ず見る。**
 *
 * 以前は時刻を保存していたのに読んでいなかった。そのため通信に失敗すると、
 * 何日前の数字でも現在値の顔をして出ていた（どこにも「いつのものか」が出ない）。
 */
function cacheGet(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.data) return null;
    if(typeof o.t === 'number' && Date.now() - o.t > CACHE_MAX_MS) return null;
    SHOWN_KEY = key;
    updateFreshBar();
    return o.data;
  }catch(e){ return null; }
}

/** その控えを保存してからの経過ミリ秒。分からなければ null */
function cacheAge(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && typeof o.t === 'number') ? Date.now() - o.t : null;
  }catch(e){ return null; }
}

function cacheSet(key, data){
  try{ localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), data: data })); }
  catch(e){ /* 容量超過などは無視。次回また取りに行くだけ */ }
  SHOWN_KEY = key;
  NET_OK = true;
  updateFreshBar();
}

/**
 * 「いつの数字か」の帯。
 *
 * 出すのは**困っているときだけ**にする。
 *   - 取り直せなかった（電波が無い・サーバーが落ちている）
 *   - 控えが20分より古い
 * うまくいっているときは何も出さない。常時出すと、ただの飾りになって読まれなくなる。
 */
function updateFreshBar(){
  const age = SHOWN_KEY ? cacheAge(SHOWN_KEY) : null;
  const old = age !== null && age > CACHE_STALE_MS;
  if(NET_OK && !old){ removeFreshBar(); return; }

  let el = document.getElementById('freshbar');
  if(!el){
    el = document.createElement('div');
    el.id = 'freshbar';
    el.style.cssText =
      'position:fixed;left:0;right:0;top:0;z-index:60;padding:9px 14px;' +
      'font-family:inherit;font-size:12.5px;line-height:1.5;text-align:center;' +
      'background:#3A2A1A;color:#FFE646;border-bottom:1px solid #6B4E1E';
    document.body.appendChild(el);
  }
  el.textContent = (NET_OK ? '⚠ 古い数字かもしれません' : '⚠ つながっていません') +
    '（最終更新 ' + fmtAgo(age) + '）';
  // 帯のぶんだけ本文を下げる。上に重ねるとヘッダーが隠れて操作できなくなる
  document.body.style.paddingTop = el.offsetHeight + 'px';
}

function removeFreshBar(){
  const el = document.getElementById('freshbar');
  if(el) el.remove();
  document.body.style.paddingTop = '';
}

/** 経過時間を「◯分前」「◯時間前」にする。分からないときは「不明」 */
function fmtAgo(ms){
  if(ms === null || ms === undefined) return '不明';
  const m = Math.floor(ms / 60000);
  if(m < 1) return 'たった今';
  if(m < 60) return m + '分前';
  const h = Math.floor(m / 60);
  if(h < 24) return h + '時間前';
  return Math.floor(h / 24) + '日前';
}

// 版を上げたときに残る古い控えを片づける。放っておくと容量を食うだけ
(function purgeOldCache(){
  try{
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(k && k.indexOf('apexCache:') === 0 && k.indexOf(CACHE_PREFIX) !== 0) localStorage.removeItem(k);
    }
  }catch(e){}
})();

/**
 * 他の画面ぶんを裏で取っておく。
 * タブを初めて開くときの2〜3秒を無くすため。いま見ている画面が出てから走らせる。
 * 取れなかったら黙って諦める（次に開いたときに取りに行くだけ）。
 */
function warmOtherScreens(myPersonId){
  const jobs = [
    ['home',                       { action:'home' }],
    ['ranking:month::person',      { action:'ranking', period_kind:'month', period_value:'', axis:'person' }],
    ['circle:',                    { action:'circle' }],
    ['mypage:' + (myPersonId||''), myPersonId ? { action:'mypage', person_id:myPersonId } : { action:'mypage' }],
    ['masters',                    { action:'masters' }]
  ];
  // settings と review_list は編集キーが要る。持っていない端末では取りに行っても弾かれるだけ
  if(store.get(LS.key)){
    jobs.push(['settings',    { action:'settings' }]);
    jobs.push(['review_list', { action:'review_list' }]);
  }
  let i = 0;
  const next = () => {
    if(i >= jobs.length) return;
    const [key, params] = jobs[i++];
    // すでに新しい控えがあるなら飛ばす（5分もてば十分）
    let fresh = false;
    try{
      const raw = localStorage.getItem(CACHE_PREFIX + key);
      if(raw){ const o = JSON.parse(raw); fresh = o && (Date.now() - o.t) < 5 * 60 * 1000; }
    }catch(e){}
    if(fresh){ next(); return; }
    apiGet(params)
      .then(j => { cacheSet(key, j); })
      .catch(() => {})
      .then(() => setTimeout(next, 300));   // 1本ずつ。まとめて叩かない
  };
  setTimeout(next, 1200);   // いま見ている画面の描画を邪魔しない
}

const S = {
  url: sanitizeGasUrl(store.get(LS.url)) || DEFAULT_GAS_URL,
  key: store.get(LS.key) || '',
  personId: store.get(LS.person) || '',
  data: null,
  view: 'main',      // main | goal | member | weapon
  editPerson: null,  // member/weapon 編集中の person
  draft: null,       // 編集中の値
  weaponSlot: 1,
  pending: 0,
  saving: 0
};

const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backEl = document.getElementById('back');
const saveEl = document.getElementById('savestate');

/**
 * 読み取り。生データ（一覧・試合の詳細・画像）と運用情報はサーバー側で
 * 編集キーを要求するので、端末が持っていれば毎回付ける。
 * 集計済みの画面（ホーム・ランキング・サークル・マイページ）は鍵が無くても返る。
 */
function apiGet(params){
  const p = Object.assign({}, params);
  const k = store.get(LS.key) || '';
  if(k) p.key = k;
  const q = new URLSearchParams(p).toString();
  // 「サーバーに届かなかった」と「届いたが断られた」を分ける。
  // 前者だけがオフライン。AUTHで弾かれたのを「つながっていません」と出すと嘘になる
  return fetch(S.url + '?' + q, { method:'GET' })
    .catch(err => { NET_OK = false; updateFreshBar(); throw err; })
    .then(r => {
      if(!r.ok){ NET_OK = false; updateFreshBar(); throw new Error('HTTP ' + r.status); }
      return r.json();
    })
    .then(j => {
      NET_OK = true; updateFreshBar();
      if(!j.ok){
        const e = new Error(j.error || '取得に失敗しました');
        e.code = j.code || '';
        throw e;
      }
      return j;
    });
}

/** 書き込み。GASのCORS制約により Content-Type は text/plain にする */
function apiPost(body){
  const payload = Object.assign({}, body, { edit_key: S.key, person_id: S.personId });
  markSaving(1);
  return fetch(S.url, {
      method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { if(!j.ok) throw new Error(j.error || '保存に失敗しました'); return j; })
    .finally(() => markSaving(-1));
}
function markSaving(d){ S.saving += d; saveEl.textContent = S.saving > 0 ? '保存中…' : ''; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg, isError){
  const old = document.getElementById('toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast'; t.className = 'toast' + (isError ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isError ? 4200 : 2200);
}

/** 区画ごとに色が上がっていく。紫 → 赤 → 黄 → ライム */
const ZONE_COLORS = ['var(--purple)', 'var(--red)', 'var(--yellow)', 'var(--lime)'];

function zoneOf(v, g){
  if(v >= g.t3) return 3;
  if(v >= g.t2) return 2;
  if(v >= g.t1) return 1;
  return 0;
}

function goalBar(g){
  const v = Number(g.value) || 0;
  const zi = zoneOf(v, g);
  const bounds = [[0, g.t1], [g.t1, g.t2], [g.t2, g.t3], [g.t3, null]];
  const labels = [g.label0, g.label1, g.label2, g.label3];

  const zones = bounds.map((b, i) => {
    if(i < zi) return '<div class="z"><i style="width:100%;background:' + ZONE_COLORS[i] + '"></i></div>';
    if(i > zi) return '<div class="z"></div>';
    if(i === 3) return '<div class="z"><i style="width:100%;background:' + ZONE_COLORS[3] + '"></i></div>';
    const span = b[1] - b[0];
    const raw = span > 0 ? ((v - b[0]) / span) * 100 : 0;
    const pct = raw <= 0 ? 0 : Math.max(2, Math.min(100, Math.round(raw)));
    return '<div class="z"><i style="width:' + pct + '%;background:' + ZONE_COLORS[i] + '"></i></div>';
  }).join('');

  const thr = '<div class="thr">' +
    '<span style="left:25%">' + g.t1 + '回</span>' +
    '<span style="left:50%">' + g.t2 + '回</span>' +
    '<span style="left:75%">' + g.t3 + '回</span></div>';

  const zl = '<div class="zlabels">' + labels.map((l, i) =>
    '<div class="' + (i === zi ? 'on' : '') + '">' + esc(l) + '</div>').join('') + '</div>';

  // 及第点より上では「まだ」を付けない
  let msg;
  if(zi === 3){
    msg = esc(labels[3]) + '。ここから先は、何回取っても' + esc(labels[3]) + '。';
  }else{
    const next = [g.t1, g.t2, g.t3][zi];
    const rest = next - v;
    msg = (zi < 2 ? 'まだ' : '') + esc(labels[zi]) + '。あと <b>' + rest + '回</b> で「' + esc(labels[zi + 1]) + '」。';
  }

  return thr + '<div class="barbox"><div class="bar">' + zones + '</div></div>' + zl +
    '<div class="gmsg">' + msg + '</div>';
}

function metricLabel(id){
  const m = (S.data.metrics || []).find(x => x.id === id);

}

/** 入力を draft に取り込む。プレビューを出し直すために毎回呼ぶ */
function pullGoalDraft(){
  const g = S.draft;
  const n = id => { const e = document.getElementById(id); return e ? Number(e.value) : null; };
  const t = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const t1 = n('g_t1'), t2 = n('g_t2'), t3 = n('g_t3');
  if(t1 !== null) g.t1 = t1;
  if(t2 !== null) g.t2 = t2;
  if(t3 !== null) g.t3 = t3;
  [0,1,2,3].forEach(i => { const v = t('g_l' + i); if(v !== '') g['label' + i] = v; });
}

// 描画と結線
// ===================================================================
function render(){
  renderTabs();
  if(S.view === 'goal')        app.innerHTML = renderGoalEdit();
  else if(S.view === 'member') app.innerHTML = renderMember();
  else if(S.view === 'weapon') app.innerHTML = renderWeapon();
  else                         app.innerHTML = renderMain();
  bind();
}

function bind(){
  const eg = document.getElementById('editGoal');
  if(eg) eg.onclick = () => {
    S.draft = Object.assign({}, S.data.goal);
    S.view = 'goal'; render(); window.scrollTo({ top: 0 });
  };

  app.querySelectorAll('[data-editm]').forEach(b => {
    b.onclick = () => {
      const m = (S.data.members || []).find(x => x.person_id === b.dataset.editm);
      if(!m) return;
      S.editPerson = m;
      S.draft = {
        weapon1_id: m.weapons[0] ? m.weapons[0].weapon_id : '',
        weapon2_id: m.weapons[1] ? m.weapons[1].weapon_id : '',
        note: m.note || ''
      };
      S.view = 'member'; render(); window.scrollTo({ top: 0 });
    };
  });

  app.querySelectorAll('[data-split]').forEach(b => {
    b.onclick = () => load(b.dataset.split);
  });

  // ---- 目標編集 ----
  app.querySelectorAll('[data-metric]').forEach(b => {
    b.onclick = () => { pullGoalDraft(); S.draft.metric = b.dataset.metric; render(); };
  });
  ['g_t1','g_t2','g_t3','g_l0','g_l1','g_l2','g_l3'].forEach(id => {
    const e = document.getElementById(id);
    if(e) e.oninput = () => {
      pullGoalDraft();
      // プレビューだけ描き直す。入力中に画面ごと作り直すと文字が飛ぶ
      const box = app.querySelector('.sec + .goal');
      if(box){
        const pv = Object.assign({}, S.draft, { value:S.data.goal.value, match_count:S.data.goal.match_count });
        const bar = goalBar(pv);
        const head = box.innerHTML.slice(0, box.innerHTML.indexOf('<div class="thr">'));
        box.innerHTML = head + bar;
      }
    };
  });
  const sg = document.getElementById('saveGoal');
  if(sg) sg.onclick = async () => {
    pullGoalDraft();
    const g = S.draft;
    if(!S.key){ toast('編集キーが要ります。登録タブの設定で入れてください', true); return; }
    if(!(g.t1 > 0 && g.t2 > g.t1 && g.t3 > g.t2)){
      toast('区切りは小さい順に、1以上で入れてください', true); return;
    }
    for(const i of [0,1,2,3]){
      const v = String(g['label' + i] || '').trim();
      if(!v){ toast('言いかたが空です', true); return; }
      if(v.length > 6){ toast('言いかたは6文字までです：' + v, true); return; }
    }
    try{
      await apiPost({ action:'update_goal', split_id:S.data.split_id, metric:g.metric,
        t1:g.t1, t2:g.t2, t3:g.t3, label0:g.label0, label1:g.label1, label2:g.label2, label3:g.label3 });
      toast('決めました');
      S.view = 'main'; await load(S.data.split_id);
    }catch(e){ toast(e.message, true); }
  };
  const cg = document.getElementById('cancelGoal');
  if(cg) cg.onclick = () => { S.view = 'main'; render(); window.scrollTo({ top: 0 }); };

  // ---- メンバー編集 ----
  app.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => { pullNote(); S.weaponSlot = Number(b.dataset.pick); S.view = 'weapon'; render(); window.scrollTo({ top: 0 }); };
  });
  app.querySelectorAll('[data-clear]').forEach(b => {
    b.onclick = () => { pullNote(); S.draft['weapon' + b.dataset.clear + '_id'] = ''; render(); };
  });
  const sm = document.getElementById('saveMember');
  if(sm) sm.onclick = async () => {
    pullNote();
    if(!S.key){ toast('編集キーが要ります。登録タブの設定で入れてください', true); return; }
    try{
      await apiPost({ action:'update_profile', person_id:S.editPerson.person_id,
        weapon1_id:S.draft.weapon1_id, weapon2_id:S.draft.weapon2_id, note:S.draft.note });
      toast('保存しました');
      S.view = 'main'; await load(S.data.split_id);
    }catch(e){ toast(e.message, true); }
  };
  const cm = document.getElementById('cancelMember');
  if(cm) cm.onclick = () => { S.view = 'main'; render(); window.scrollTo({ top: 0 }); };

  // ---- 武器選び ----
  app.querySelectorAll('[data-w]').forEach(b => {
    b.onclick = () => {
      S.draft['weapon' + S.weaponSlot + '_id'] = b.dataset.w;
      S.view = 'member'; render(); window.scrollTo({ top: 0 });
    };
  });

  backEl.onclick = () => {
    if(S.view === 'weapon'){ S.view = 'member'; }
    else { S.view = 'main'; }
    render(); window.scrollTo({ top: 0 });
  };
}

function pullNote(){
  const e = document.getElementById('m_note');
  if(e && S.draft) S.draft.note = e.value;
}

async function load(splitId){
  const ck = 'circle:' + (splitId || '');
  const cached = cacheGet(ck);
  if(cached){ S.data = cached; S.view = 'main'; render(); }
  else{
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">サーバーに聞いています…</div>' +
      '<div class="sub" style="margin-top:8px">数秒かかります。そのままお待ちください。</div></div>';
  }
  try{
    const [d, h] = await Promise.all([
      apiGet(splitId ? { action:'circle', split_id:splitId } : { action:'circle' }),
      apiGet({ action:'home' }).catch(() => null)
    ]);
    S.data = d;
    if(h) S.pending = h.pending || 0;
    cacheSet(ck, d);
    warmOtherScreens(S.personId);
    // 編集の途中なら画面は動かさない。中身だけ新しくする
    if(!cached || S.view === 'main'){ S.view = 'main'; render(); }
  }catch(e){
    if(cached) return;
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">つながりませんでした</div>' +
      '<div class="sub" style="margin-top:9px">' + esc(e.message) + '</div></div>' +
      '<button class="btn" id="again">もう一度ためす</button>';
    document.getElementById('again').onclick = () => load(splitId);
  }
}

function boot(){
  renderTabs();
  if(!S.url){
    app.innerHTML = '<div class="card" style="margin-top:8px">' +
      '<div class="dela" style="font-size:15px">まず接続先を教えてください</div>' +
      '<div class="sub" style="margin-top:9px">この端末はまだサーバーの場所を知りません。<br>' +
      '<span style="color:var(--lime)">登録タブ</span>でWebアプリのURLを保存すると、ここに出ます。</div></div>' +
      '<button class="btn" id="go" style="border-color:var(--lime);color:var(--lime)">登録タブをひらく</button>';
    document.getElementById('go').onclick = () => { location.href = '../record/'; };
    return;
  }
  load('');
}

boot();
</script>

<script>
// ホーム画面のアイコンから開けるようにする。電波が悪くても画面自体は出る。
// 数字の控えは画面側（localStorage）が持っているので、ここでは触らない。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {
      // 登録できなくてもアプリは普通に動く。file:// で開いたときなど
    });
  });
}
</script>
</body>
