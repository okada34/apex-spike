<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登録｜Apexサークル戦績</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#241C52">
<link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サークル戦績">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#241C52; --card:#332A70; --sunken:#2E2559; --line:#493D96; --dim:#3B3178;
    --purple:#7C5CFF; --yellow:#FFE646; --lime:#C8FF00; --red:#FF5470;
    --ink:#FFFFFF; --ink2:#C6BCF2; --ink3:#A99CE0; --ink4:#8478C4; --invert:#241C52;
    --limeDark:#9CC700;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; padding:0; background:var(--ground); color:var(--ink);
    font-family:'RocknRoll One','Hiragino Sans','Yu Gothic',sans-serif;
    font-size:14px; line-height:1.7; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .dela{ font-family:'Dela Gothic One','Hiragino Sans',sans-serif; font-weight:400; }
  .rr{ font-family:'RocknRoll One','Hiragino Sans',sans-serif; font-weight:400; }
  .mono{ font-family:'Roboto Mono',ui-monospace,monospace; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
         padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  main{ flex:1; padding-bottom:14px; }

  /* ---- ヘッダー ---- */
  header{
    position:sticky; top:0; z-index:20; background:var(--ground);
    padding:16px 18px 10px; display:flex; align-items:center; gap:11px;
  }
  header .ttl{ font-family:'Dela Gothic One',sans-serif; font-size:17px; }
  .iconbtn{ background:none; border:0; padding:6px; display:flex; align-items:center; cursor:pointer; }
  .saving{ font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink3); margin-left:auto; }

  /* ---- 黄の看板 ---- */
  .board{
    margin:6px 18px 0; background:var(--yellow); border-radius:18px;
    padding:18px 18px 8px; transform:rotate(-1.4deg);
  }
  .board .bh{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .board .bt{ font-family:'Dela Gothic One',sans-serif; font-size:22px; color:var(--invert); }
  .board .bs{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:10px; color:rgba(36,28,82,.6); letter-spacing:-.04em; }
  .krow{ padding:14px 0; border-bottom:2px solid rgba(36,28,82,.14); }
  .kline{ display:flex; align-items:center; gap:10px; }
  .ktag{ font-size:10px; padding:3px 8px; border-radius:20px; flex:none; white-space:nowrap; }
  .ktag.fix{ background:var(--red); color:#FFFFFF; }
  .ktag.chk{ background:var(--lime); color:var(--invert); }
  .ktag.done{ background:var(--card); color:var(--ink2); }
  .kname{ font-family:'Dela Gothic One',sans-serif; font-size:20px; color:var(--invert); }
  .kval{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:24px; color:var(--invert); letter-spacing:-.04em; margin-left:auto; }
  .kdesc{ font-size:11px; color:rgba(36,28,82,.72); margin-top:6px; line-height:1.6; }
  .bfoot{ display:flex; justify-content:flex-end; padding:10px 0 3px; }

  /* ---- カード ---- */
  .card{ background:var(--card); border-radius:18px; padding:15px; margin:0 18px 10px; }
  .card.red{ border:1.5px solid var(--red); }
  .sec{ font-family:'Dela Gothic One',sans-serif; font-size:15px; margin:20px 18px 11px; }
  .sub{ font-size:11px; line-height:1.7; color:var(--ink3); }
  .spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  /* ---- 数値マス ---- */
  .grid4{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-top:11px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:7px; }
  .grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:11px; }
  .fld{ background:var(--sunken); border:2px solid transparent; border-radius:10px; padding:8px 4px; text-align:center; }
  .fld.bad{ border-color:var(--red); }
  .fld .lb{ font-size:9px; color:var(--ink3); }
  .fld.bad .lb{ color:var(--red); }
  .fld input{
    font-family:'Roboto Mono',monospace; font-weight:700; letter-spacing:-.04em;
    font-size:18px; color:var(--ink); background:transparent; border:0; text-align:center;
    width:100%; padding:1px 0 0; -moz-appearance:textfield;
  }
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .fld input:focus{ outline:none; color:var(--lime); }
  .fld .ro{ font-family:'Roboto Mono',monospace; font-weight:700; letter-spacing:-.04em; font-size:16px; margin-top:1px; }

  /* ---- ボタン ---- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:7px;
    height:52px; border-radius:14px; border:0; width:100%; cursor:pointer;
    font-family:'Dela Gothic One',sans-serif; font-size:15px; color:var(--ink); background:var(--purple);
  }
  .btn.ghost{ background:transparent; border:2px solid var(--line); color:var(--ink2); font-family:'RocknRoll One',sans-serif; font-size:12px; }
  .btn.redline{ background:transparent; border:2px solid var(--red); color:var(--ink); font-family:'RocknRoll One',sans-serif; font-size:12px; }
  .btn.limeline{ background:transparent; border:2px solid var(--lime); color:var(--lime); }
  .btn:disabled{ opacity:.45; }
  /* 赤枠が残っている間の確定ボタン。押せるが、まだ出番ではないと分かる見た目にする */
  .btn.wait{ background:transparent; border:2px dashed var(--line); color:var(--ink4); }
  .textlink{ height:44px; display:flex; align-items:center; justify-content:center; font-size:11.5px; color:var(--lime); cursor:pointer; }
  .textlink.red{ color:var(--red); }

  /* ---- 一覧の試合カード ---- */
  .mrow{
    display:block; width:100%; text-align:left; background:var(--card); border:0;
    border-radius:18px; padding:14px 15px; margin:0 18px 9px; cursor:pointer;
    font-family:inherit; color:var(--ink); width:calc(100% - 36px);
  }
  .mrow.bad{ border-left:4px solid var(--red); }
  .mrow.dim{ background:var(--sunken); color:var(--ink4); }
  .pill{ font-size:9.5px; padding:3px 9px; border-radius:20px; flex:none; white-space:nowrap; }
  .pill.red{ background:var(--red); color:#fff; }
  .pill.lime{ background:var(--lime); color:var(--invert); }
  .pill.gray{ background:var(--sunken); color:var(--ink2); }

  /* ---- レジェンド ---- */
  .legbox{ background:var(--sunken); border:2px solid transparent; border-radius:14px; padding:12px; margin-top:11px; }
  .legbox.bad{ border-color:var(--red); }
  .big3{ display:flex; gap:7px; margin-top:11px; }
  .big3 button{
    flex:1; height:54px; background:#3A2F86; border:0; border-left:4px solid var(--line);
    border-radius:14px; color:var(--ink); font-family:'Dela Gothic One',sans-serif; font-size:11.5px; cursor:pointer;
  }

  /* ---- 画面下に貼り付く操作バー ---- */
  /* 確信度が低い項目の確認バー */
  .ackbar{
    margin:14px 18px 0; background:var(--card); border-left:4px solid var(--red);
    border-radius:0 14px 14px 0; padding:14px 16px;
  }
  .ackbar .at{ font-family:'Dela Gothic One',sans-serif; font-size:13.5px; }
  .ackbar .ad{ font-size:11px; line-height:1.7; color:var(--ink3); margin-top:6px; }
  .ackbar .btn{ margin-top:11px; }

  .actbar{
    position:sticky; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:15; background:var(--ground);
    border-top:1px solid rgba(255,255,255,.09); padding:11px 18px 12px;
    display:flex; flex-direction:column; gap:9px;
  }
  .actrow{ display:flex; gap:9px; }
  .actrow .btn{ flex:1; }

  /* ---- 下タブ ---- */
  /* 帯は画面の端から端まで。中のタブだけ本文と同じ幅に揃える。
     .wrap の max-width の中に入れると、横に余白が出て帯が切れて見える */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:16; height:70px; background:var(--card);
    box-shadow:0 -6px 18px rgba(0,0,0,.38); display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav .tabs{ width:100%; max-width:430px; display:flex; align-items:center; }
  nav .tab{ flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; background:none; border:0; cursor:pointer; padding:0; }
  nav .tab .lb{ font-family:'RocknRoll One',sans-serif; font-size:9.5px; color:var(--ink3); }
  nav .tab.on{ justify-content:center; }
  nav .tab.on .inner{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--lime); border-radius:8px; padding:7px 11px 6px; transform:rotate(-1.4deg);
  }
  nav .tab.on .lb{ color:var(--invert); }
  .badge{
    position:absolute; top:-5px; right:-8px; min-width:17px; height:17px; border-radius:20px;
    background:var(--red); display:flex; align-items:center; justify-content:center; padding:0 4px;
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:9.5px; color:#fff; letter-spacing:0;
  }

  /* ---- シート・トースト ---- */
  .sheet{ position:fixed; inset:0; z-index:40; background:rgba(10,6,30,.75); display:flex; align-items:flex-end; }
  .sheetinner{
    background:var(--ground); border-radius:22px 22px 0 0; width:100%; max-width:430px; margin:0 auto;
    max-height:86vh; overflow:auto; padding:18px 18px 28px;
  }
  .lgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:7px; margin:8px 0 16px; }
  .lgrid button{
    padding:12px 6px; background:var(--sunken); border:0; border-left:3px solid var(--line);
    border-radius:10px; color:var(--ink); font-family:'RocknRoll One',sans-serif; font-size:12.5px; cursor:pointer;
  }
  .clsline{ display:flex; align-items:center; gap:8px; margin-top:16px; font-family:'Dela Gothic One',sans-serif; font-size:13px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }

  /* ---- キャラをまとめて直す ---- */
  .bhead{
    position:sticky; top:56px; z-index:18; background:var(--ground);
    padding:10px 18px 12px; display:flex; align-items:center; gap:10px;
  }
  .bhead .cnt{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:13px; color:var(--ink2); letter-spacing:-.04em; margin-left:auto; }
  .bmatch{ background:var(--card); border-radius:18px; padding:13px 14px 14px; margin:0 18px 12px; }
  .bmatch .bh{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .bmatch .bseq{ font-family:'Dela Gothic One',sans-serif; font-size:14px; }
  .bmatch .bpl{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:11px; color:var(--ink3); letter-spacing:-.04em; }
  .bsame{
    margin-left:auto; background:none; border:1.5px solid var(--lime); border-radius:12px;
    padding:0 13px; min-height:44px; cursor:pointer; font-family:'RocknRoll One',sans-serif;
    font-size:11px; color:var(--lime); white-space:nowrap;
  }
  .bsame:disabled{ border-color:var(--line); color:var(--ink4); cursor:default; }
  .bshot{ width:100%; border-radius:12px; background:#000; display:block; }
  .bshotbox{ width:100%; aspect-ratio:16/9; border-radius:12px; background:var(--sunken); display:flex; align-items:center; justify-content:center; }
  .bslots{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:10px; }
  .bslot{
    background:var(--sunken); border:1.5px solid var(--line); border-radius:12px; padding:9px 6px;
    cursor:pointer; text-align:center; min-height:62px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .bslot .who{ font-size:9.5px; color:var(--ink4); }
  .bslot .leg{ font-family:'Dela Gothic One',sans-serif; font-size:12px; color:var(--ink); line-height:1.3; }
  .bslot.empty{ border-style:dashed; }
  .bslot.empty .leg{ color:var(--ink4); font-family:'RocknRoll One',sans-serif; font-size:11px; }
  .bslot.stranger{ opacity:.5; cursor:default; border-style:dotted; }
  .bslot.filled{ border-color:var(--purple); }

  /* 送る前の確認一覧。何がどう変わるかを1行ずつ出す */
  .clist{ margin-top:14px; max-height:46vh; overflow-y:auto; }
  .crow{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    padding:10px 2px; border-bottom:1px solid var(--line);
  }
  .crow:last-child{ border-bottom:0; }
  .cseq{
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:10px; letter-spacing:-.02em;
    color:var(--ink4); background:var(--sunken); border-radius:6px; padding:3px 7px; flex:none;
  }
  .cwho{ font-size:12.5px; color:var(--ink2); flex:none; }
  .cval{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .cval .from{ color:var(--ink4); text-decoration:line-through; }
  .cval .arw{ color:var(--ink4); font-size:11px; }
  .cval .to{ font-family:'Dela Gothic One',sans-serif; font-size:13px; color:var(--lime); }
  .cval .to.blank{ color:var(--red); font-family:'RocknRoll One',sans-serif; font-size:12px; }
  .bbar{
    position:sticky; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:15;
    background:var(--ground); padding:10px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.1);
  }
  .toast{
    position:fixed; left:16px; right:16px; bottom:150px; z-index:50; max-width:398px; margin:0 auto;
    background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 15px; font-size:12.5px;
  }
  .toast.err{ border-color:var(--red); }

  img.shot{ width:calc(100% - 36px); margin:0 18px; border-radius:14px; background:#000; display:block; }
  .shotbox{ height:199px; margin:0 18px; border-radius:14px; background:var(--sunken); display:flex; align-items:center; justify-content:center; }
  label{ display:block; font-size:11px; color:var(--ink3); margin:16px 0 6px; }
  input[type=text],input[type=password],select,textarea{
    font-family:'RocknRoll One',sans-serif; font-size:16px; width:100%; padding:12px 13px;
    border-radius:12px; border:1.5px solid var(--line); background:var(--sunken); color:var(--ink);
  }

  /* 地色（#241C52）や面（#332A70）と紛れないよう、ベタ塗りにする */
  .toast{
    background:var(--lime); border:0; color:var(--invert);
    font-family:'Dela Gothic One','Hiragino Sans',sans-serif; line-height:1.6;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .toast.err{ background:var(--red); color:#FFFFFF; border:0; }
  .toast .btn, .toast button{
    background:rgba(36,28,82,.14); border:0; color:var(--invert);
    font-family:'RocknRoll One',sans-serif;
  }
  .toast.err .btn, .toast.err button{ background:rgba(255,255,255,.2); color:#FFFFFF; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <button class="iconbtn" id="back" hidden aria-label="戻る">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C6BCF2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    </button>
    <div class="ttl" id="title">登録</div>
    <span class="saving" id="savestate"></span>
    <button class="iconbtn" id="gear" aria-label="設定">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A99CE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <main id="app"></main>

  <nav><div class="tabs" id="tabbar"></div></nav>
</div>

<script>
// ===================================================================
// 状態
// ===================================================================

/** サーバー（GASのWebアプリ）の住所。設定画面で上書きできる */
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxIVM6CusWbS3534Ij87AaLW25BKwh6vyLsmFj2OS1w0etmKJZODTmur27Bkm7tvo6sNA/exec';

/**
 * 保存された住所が壊れていたら使わない。
 * GASのWebアプリの住所は半角英数と - _ だけでできている。
 * 1文字でも別の文字が混ざっていたら、手入力の失敗とみなして埋め込みのほうを使う。
 */
function sanitizeGasUrl(u){
  if(!u) return '';
  var head = 'https://script.google.com/macros/s/';
  var tail = '/exec';
  if(u.indexOf(head) !== 0) return '';
  if(u.slice(-tail.length) !== tail) return '';
  var id = u.slice(head.length, u.length - tail.length);
  if(!id) return '';
  // 半角英数と - _ 以外が1文字でも混ざっていたら、手入力の失敗とみなす
  for(var i = 0; i < id.length; i++){
    var c = id.charCodeAt(i);
    var ok = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 45 || c === 95;
    if(!ok) return '';
  }
  return u;
}

const LS = {
  url: 'apexGasUrl', key: 'apexEditKey', person: 'apexPersonId', last: 'apexLastMatchId'
};

/**
 * localStorage が使えない環境（file: や data: URL、プライベートモード）でも落ちないようにする。
 * ここで例外が出ると読み込み時点で止まり、画面が真っ白になる（実際になった）。
 * 使えないときはメモリ上に持つ。タブを閉じると消えるが、動きはする。
 */
const MEM = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return MEM[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ MEM[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete MEM[k]; } },
  usable(){ try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } }
};


/**
 * 画面をまたいで結果を覚えておく置き場。
 * タブを切り替えるたびにGASを待つと毎回2〜3秒かかるので、前回の内容で先に描く。
 * 中身は数秒後に裏で最新へ差し替わる。
 */
// 版を上げると、古い形の控えを丸ごと無視できる。中身の作りを変えたときに使う
const CACHE_PREFIX = 'apexCache:v2:';
const CACHE_STALE_MS = 20 * 60 * 1000;        // これを超えたら「古いかも」と伝える
const CACHE_MAX_MS   = 24 * 60 * 60 * 1000;   // これを超えたら、そもそも使わない

/** いま画面に出している控えの鍵。鮮度の表示に使う */
let SHOWN_KEY = null;
/** 直近の通信が成功したか。失敗したまま古い数字を出し続けないための印 */
let NET_OK = true;

/**
 * 控えを読む。**保存した時刻も必ず見る。**
 *
 * 以前は時刻を保存していたのに読んでいなかった。そのため通信に失敗すると、
 * 何日前の数字でも現在値の顔をして出ていた（どこにも「いつのものか」が出ない）。
 */
function cacheGet(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.data) return null;
    if(typeof o.t === 'number' && Date.now() - o.t > CACHE_MAX_MS) return null;
    SHOWN_KEY = key;
    updateFreshBar();
    return o.data;
  }catch(e){ return null; }
}

/** その控えを保存してからの経過ミリ秒。分からなければ null */
function cacheAge(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && typeof o.t === 'number') ? Date.now() - o.t : null;
  }catch(e){ return null; }
}

function cacheSet(key, data){
  try{ localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), data: data })); }
  catch(e){ /* 容量超過などは無視。次回また取りに行くだけ */ }
  SHOWN_KEY = key;
  NET_OK = true;
  updateFreshBar();
}

/**
 * 「いつの数字か」の帯。
 *
 * 出すのは**困っているときだけ**にする。
 *   - 取り直せなかった（電波が無い・サーバーが落ちている）
 *   - 控えが20分より古い
 * うまくいっているときは何も出さない。常時出すと、ただの飾りになって読まれなくなる。
 */
function updateFreshBar(){
  const age = SHOWN_KEY ? cacheAge(SHOWN_KEY) : null;
  const old = age !== null && age > CACHE_STALE_MS;
  if(NET_OK && !old){ removeFreshBar(); return; }

  let el = document.getElementById('freshbar');
  if(!el){
    el = document.createElement('div');
    el.id = 'freshbar';
    el.style.cssText =
      'position:fixed;left:0;right:0;top:0;z-index:60;padding:9px 14px;' +
      'font-family:inherit;font-size:12.5px;line-height:1.5;text-align:center;' +
      'background:#3A2A1A;color:#FFE646;border-bottom:1px solid #6B4E1E';
    document.body.appendChild(el);
  }
  el.textContent = (NET_OK ? '⚠ 古い数字かもしれません' : '⚠ つながっていません') +
    '（最終更新 ' + fmtAgo(age) + '）';
  // 帯のぶんだけ本文を下げる。上に重ねるとヘッダーが隠れて操作できなくなる
  document.body.style.paddingTop = el.offsetHeight + 'px';
}

function removeFreshBar(){
  const el = document.getElementById('freshbar');
  if(el) el.remove();
  document.body.style.paddingTop = '';
}

/** 経過時間を「◯分前」「◯時間前」にする。分からないときは「不明」 */
function fmtAgo(ms){
  if(ms === null || ms === undefined) return '不明';
  const m = Math.floor(ms / 60000);
  if(m < 1) return 'たった今';
  if(m < 60) return m + '分前';
  const h = Math.floor(m / 60);
  if(h < 24) return h + '時間前';
  return Math.floor(h / 24) + '日前';
}

// 版を上げたときに残る古い控えを片づける。放っておくと容量を食うだけ
(function purgeOldCache(){
  try{
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(k && k.indexOf('apexCache:') === 0 && k.indexOf(CACHE_PREFIX) !== 0) localStorage.removeItem(k);
    }
  }catch(e){}
})();

/**
 * 他の画面ぶんを裏で取っておく。
 * タブを初めて開くときの2〜3秒を無くすため。いま見ている画面が出てから走らせる。
 * 取れなかったら黙って諦める（次に開いたときに取りに行くだけ）。
 */
function warmOtherScreens(myPersonId){
  const jobs = [
    ['home',                       { action:'home' }],
    ['ranking:month::person',      { action:'ranking', period_kind:'month', period_value:'', axis:'person' }],
    ['circle:',                    { action:'circle' }],
    ['mypage:' + (myPersonId||''), myPersonId ? { action:'mypage', person_id:myPersonId } : { action:'mypage' }],
    ['masters',                    { action:'masters' }]
  ];
  // settings と review_list は編集キーが要る。持っていない端末では取りに行っても弾かれるだけ
  if(S.key){
    jobs.push(['settings',    { action:'settings' }]);
    jobs.push(['review_list', { action:'review_list' }]);
  }
  let i = 0;
  const next = () => {
    if(i >= jobs.length) return;
    const [key, params] = jobs[i++];
    // すでに新しい控えがあるなら飛ばす（5分もてば十分）
    let fresh = false;
    try{
      const raw = localStorage.getItem(CACHE_PREFIX + key);
      if(raw){ const o = JSON.parse(raw); fresh = o && (Date.now() - o.t) < 5 * 60 * 1000; }
    }catch(e){}
    if(fresh){ next(); return; }
    apiGet(params)
      .then(j => { cacheSet(key, j); })
      .catch(() => {})
      .then(() => setTimeout(next, 300));   // 1本ずつ。まとめて叩かない
  };
  setTimeout(next, 1200);   // いま見ている画面の描画を邪魔しない
}

/**
 * 読み取り。生データ（一覧・試合の詳細・画像）はサーバー側で編集キーを要求するので、
 * 持っていれば毎回付ける。集計済みの画面は鍵が無くても返る。
 */
function apiGet(params){
  const p = Object.assign({}, params);
  if(S.key) p.key = S.key;
  const q = new URLSearchParams(p).toString();
  // 「サーバーに届かなかった」と「届いたが断られた」を分ける。
  // 前者だけがオフライン。AUTHで弾かれたのを「つながっていません」と出すと嘘になる
  return fetch(S.url + '?' + q, { method:'GET' })
    .catch(err => { NET_OK = false; updateFreshBar(); throw err; })
    .then(r => {
      if(!r.ok){ NET_OK = false; updateFreshBar(); throw new Error('HTTP ' + r.status); }
      return r.json();
    })
    .then(j => {
      NET_OK = true; updateFreshBar();
      if(!j.ok){
        const e = new Error(j.error || '取得に失敗しました');
        e.code = j.code || '';
        throw e;
      }
      return j;
    });
}

/**
 * 書き込み。編集キーと操作者は毎回ここで足す。
 * GASのCORS制約により Content-Type は text/plain にする（疎通確認で確定済み）。
 */
function apiPost(body){
  const payload = Object.assign({}, body, { edit_key: S.key, person_id: S.personId });
  markSaving(1);
  return fetch(S.url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(() => markSaving(-1));
}

function markSaving(d){
  S.pending += d;
  saveEl.textContent = S.pending > 0 ? '保存中…' : '';
}

function toast(msg, isError, retry){
  const old = document.getElementById('toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  if(retry){
    const b = document.createElement('button');
    b.className = 'btn ghost';
    b.style.marginTop = '12px';
    b.textContent = 'もう一度送る';
    b.onclick = () => { t.remove(); retry(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  if(!isError) setTimeout(() => t.remove(), 2200);
}

}

    document.getElementById('secOk').innerHTML =
      `<div class="card"><div class="dela" style="font-size:15px">全部おわりました</div>
       <div class="sub" style="margin-top:8px">直すところは1つも残っていません。おつかれさま。</div></div>`;
  }

  renderTabs();
  prefetchImages(rows.slice(0, 5).map(m => m.image_ref));

  // キャラだけをまとめて直す入口。1体ずつ開いて選ぶと往復が多すぎるため
  const bulkBtn = document.createElement('button');
  const missing = rows.filter(m => m.legend_missing).length;
  bulkBtn.className = 'btn ' + (missing ? 'limeline' : 'ghost');
  bulkBtn.style.cssText = 'margin:14px 18px 0;width:calc(100% - 36px)';
  bulkBtn.textContent = missing
    ? 'キャラをまとめて直す（' + missing + '試合ぶん残り）'
    : 'キャラをまとめて直す';
  bulkBtn.onclick = () => openBulkLegends('');
  app.appendChild(bulkBtn);

  const gu = document.getElementById('giveUp');
  if(gu) gu.onclick = () => giveUpFailed(gu);

  // 途中で閉じていたら、その試合から再開できるようにする
  const last = store.get(LS.last);
  if(last && rows.some(m => m.match_id === last)){
    const b = document.createElement('button');
    b.className = 'btn ghost';
    b.style.cssText = 'width:calc(100% - 36px);margin:0 18px 12px';
    b.textContent = '前回の続きから';
    b.onclick = () => openDetail(last);
    app.insertBefore(b, document.getElementById('secBad'));
  }
}

  host.innerHTML = `<div class="sec">${title} <span class="mono" style="font-size:12px;color:${mod==='bad'?'var(--red)':'var(--ink3)'}">${rows.length}</span></div>
                    <div class="sub" style="margin:-6px 18px 11px">${note}</div>`;

      <div class="spread">
        <span><span class="mono" style="font-size:13px">${esc(m.session_date)}</span>
              <span class="sub" style="margin-left:6px">${esc(hhmm(m.captured_at))}</span></span>
        <span class="sub">${m.seq}戦目</span>
      </div>

/** 一覧を開いた時点で裏で画像を取り始める。タップ時の待ち時間を消すため */
function prefetchImages(ids){
  ids.filter(Boolean).forEach(id => {
    if(S.images[id]) return;
    S.images[id] = 'loading';
    apiGet({ action:'image_thumb', file_id:id, w:1600 })
      .then(r => { S.images[id] = 'data:' + r.mime_type + ';base64,' + r.data_base64; paintImage(id); })
      .catch(() => { delete S.images[id]; });
  });
}

function paintImage(fileId){
  const src = S.images[fileId];
  if(!src || src === 'loading') return;

  // 試合の詳細（1枚）
  const img = document.getElementById('shot');
  if(img && img.dataset.fileId === fileId){
    img.src = src; img.hidden = false;
    const box = document.getElementById('shotbox');
    if(box) box.hidden = true;
  }

  // まとめ修正（何枚も並ぶ）。読み込み中の枠を画像に差し替える
  app.querySelectorAll('.bshotbox[data-file-id="' + fileId + '"]').forEach(box => {
    const el = document.createElement('img');
    el.className = 'bshot';
    el.src = src;
    el.dataset.fileId = fileId;
    el.alt = 'リザルト画面';
    box.replaceWith(el);
  });
}

// ===================================================================
// 試合の詳細（カンバス2〜3枚目）
// ===================================================================
async function openDetail(matchId){
  store.set(LS.last, matchId);
  S.view = 'detail';
  titleEl.textContent = '試合の詳細';
  backEl.hidden = false;
  S.ack = {};

  // 一度開いた試合は控えから即出す。GASは1往復2〜3秒かかるので、待たせない
  if(S.details[matchId]){
    S.detail = S.details[matchId];
    renderDetail();
    prefetchNextDetail(matchId);
    return;
  }

  app.innerHTML = '<div class="card" style="margin-top:8px"><div class="sub">読み込み中…</div></div>';
  try{
    S.detail = await apiGet({ action:'match_detail', match_id:matchId });
    S.details[matchId] = S.detail;
  }catch(e){
    app.innerHTML = `<div class="card red" style="margin-top:8px">読み込めませんでした。<div class="sub" style="margin-top:6px">${esc(e.message)}</div></div>`;
    return;
  }
  renderDetail();
  prefetchNextDetail(matchId);
}

/** いま見ている試合の次を、裏で取っておく。「次の試合」を押した瞬間に出せるようにする */
function prefetchNextDetail(matchId){
  const rows = (S.list && S.list.matches) || [];
  const i = rows.findIndex(m => m.match_id === matchId);
  if(i < 0) return;
  [rows[i + 1], rows[i - 1]].forEach(m => {
    if(!m || S.details[m.match_id]) return;
    apiGet({ action:'match_detail', match_id:m.match_id })
      .then(j => { S.details[m.match_id] = j; })
      .catch(() => {});
  });
}

function renderDetail(){
  const m = S.detail.match;
  const entries = S.detail.entries || [];
  const accById = {}; (S.masters.accounts || []).forEach(a => accById[a.account_id] = a);
  const legById = {}; (S.masters.legends || []).forEach(l => legById[l.legend_id] = l);
  const cached = S.images[m.image_ref];
  const codes = m.review_codes || [];

  // 赤枠のルール：決める・修正する必要がある箇所。
  // キル数の合計が合わないときは、どれが誤りか分からないので3人全員のキルを赤にする
  const killSumBad = !m.kill_sum_ok;
  // 確信度による赤は、合計が合っても残る種類のもの。別に控えておく
  S.softBad = {};
  entries.forEach(e => {
    const c = e.confidence || {};
    [['kills','kills'],['assists','assists'],['knocks','knocks'],['damage','damage'],
     ['survival_sec','survival_time'],['revives','revives'],['respawns','respawns']].forEach(([f, ck]) => {
      if(low(c[ck])) S.softBad[e.entry_id + '.' + f] = true;
    });
  });
  const missing = entries.filter(e => {
    const k = (accById[e.account_id] || {}).kind;
    return k && k !== 'stranger' && !e.legend_id;
  }).length;
  const clean = codes.length === 0 && !killSumBad;

  titleEl.textContent = clean ? '試合の詳細' : '試合の詳細';

  app.innerHTML = `
    <div id="shotbox" class="shotbox"${cached && cached !== 'loading' ? ' hidden' : ''}>
      <span class="sub">リザルト画面のスクショ</span>
    </div>
    <img class="shot" id="shot" data-file-id="${esc(m.image_ref)}"
         src="${cached && cached !== 'loading' ? cached : ''}"${cached && cached !== 'loading' ? '' : ' hidden'} alt="リザルト画面">

    <div id="reason"></div>

    <div class="card" style="margin-top:12px">
      <div class="spread">
        <span><span class="mono" style="font-size:13px">${esc(m.session_date)} ${esc(hhmm(m.captured_at))}</span>
              <span class="sub" style="margin-left:8px">${m.seq}戦目</span></span>
        <span class="mono" style="font-size:10.5px;color:var(--ink3)">${esc(m.split_id || 'スプリット未特定')}</span>
      </div>
      <div class="grid3">
        ${numField('match','squad_place','順位', m.squad_place, m.squad_place === null || m.squad_place === '', false)}
        ${numField('match','squad_total_kills','部隊キル', m.squad_total_kills, killSumBad, false)}
        <div class="fld"><div class="lb">生存</div><div class="ro">${fmtSec(m.squad_survival_sec)}</div></div>
      </div>
    </div>

    <div class="sec">3人ぶんの成績</div>
    <div id="entries"></div>

    <div class="textlink red" id="exclude" style="margin:6px 18px 0">この試合を集計から外す</div>

    <div style="margin:10px 18px 0">
      <button class="btn limeline" id="applySession">キャラ・撮影者の一括反映</button>
    </div>
    <div style="height:14px"></div>
  `;

  if(codes.length){
    document.getElementById('reason').innerHTML = `
      <div class="card red" style="margin-top:12px">
        <div style="display:flex;align-items:center;gap:8px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF5470" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 8v5"></path><path d="M12 16.5v.5"></path><circle cx="12" cy="12" r="9"></circle></svg>
          <span class="dela" style="font-size:13.5px">${esc(codeTitle(codes[0].code))}</span>
        </div>
        ${codes.map(c => `<div class="sub" style="margin-top:7px;color:var(--ink2)">${esc(c.detail || c.code)}</div>`).join('')}
      </div>`;
  }

  const box = document.getElementById('entries');
  entries.forEach(e => {
    const acc = accById[e.account_id] || {};
    // accounts に無いIDは野良として扱う。メンバー扱いにするとレジェンド必須になり、
    // 直しようがないのに確定できなくなる（2026-08-23に古い2試合で起きた）
    const stranger = acc.kind === 'stranger' || !acc.kind;
    const who = stranger ? (acc.kind ? '野良' : '野良（未登録）') : (acc.person_name || '（未設定）');
    const leg = legById[e.legend_id];
    const conf = e.confidence || {};
    const slot = e.card_slot === 'center' ? 'まん中・撮った人' : e.card_slot === 'left' ? '左' : '右';
    const legBad = !stranger && !e.legend_id;
    const d = document.createElement('div');
    d.className = 'card';
    if(e.card_slot === 'center') d.style.borderLeft = '3px solid var(--purple)';
    d.innerHTML = `
      <div class="spread" style="align-items:baseline">
        <div style="display:flex;align-items:baseline;gap:8px;min-width:0">
          <span class="pill ${e.card_slot === 'center' ? '' : 'gray'}" ${e.card_slot === 'center' ? 'style="background:var(--purple);color:#fff"' : ''}>${slot}</span>
          <span class="dela" style="font-size:16px">${esc(e.raw_name)}</span>
        </div>
        <span class="sub" style="flex:none">${esc(who)}</span>
      </div>

      <div class="legbox ${legBad ? 'bad' : ''}" data-red="${legBad ? 1 : 0}">
        <div class="sub" style="color:var(--ink2)">${leg
          ? 'このレジェンドで登録します'
          : (stranger ? 'レジェンドは任意です' : 'キャラの絵から決められませんでした。選んでください。')}</div>
        <button class="btn ghost" data-entry="${esc(e.entry_id)}" data-account="${esc(e.account_id)}"
                style="margin-top:10px;height:46px;${leg ? 'border-color:'+(CLASS_COLOR[leg.legend_class]||'var(--line)') : ''}">
          ${leg ? `<span class="dela" style="font-size:14px;color:var(--ink)">${esc(leg.name_ja)}</span>` : 'レジェンドを選ぶ'}
        </button>
      </div>

      <div class="grid4">
        ${numField(e.entry_id,'kills','キル', e.kills, killSumBad || low(conf.kills), !killSumBad)}
        ${numField(e.entry_id,'assists','アシスト', e.assists, low(conf.assists), true)}
        ${numField(e.entry_id,'knocks','ノック', e.knocks, low(conf.knocks), true)}
        ${numField(e.entry_id,'damage','ダメージ', e.damage, low(conf.damage), true)}
      </div>
      <div class="grid3">
        ${numField(e.entry_id,'survival_sec','生存(秒)', e.survival_sec, low(conf.survival_time), true)}
        ${numField(e.entry_id,'revives','復活', e.revives, low(conf.revives), true)}
        ${numField(e.entry_id,'respawns','リスポーン', e.respawns, low(conf.respawns), true)}
      </div>`;
    box.appendChild(d);
  });

  // 「確信度が低い」項目がある間だけ出す確認バー。
  // 直す必要は無いが、目を通したことを1回押してもらう
  const softCount = Object.keys(S.softBad).length;
  if(softCount > 0){
    const ab = document.createElement('div');
    ab.id = 'ackbar';
    ab.className = 'ackbar';
    ab.innerHTML =
      '<div class="at">読み取りに自信のない数字が ' + softCount + ' 個あります</div>' +
      '<div class="ad">スクショと見比べて、合っていればそのままで大丈夫です。違っていたら直してください。</div>' +
      '<button class="btn ghost" data-ackall="1">ぜんぶ確認した</button>';
    app.appendChild(ab);
  }

  // 画面下に貼り付く操作バー
  const bar = document.createElement('div');
  bar.className = 'actbar';
  // 赤枠が残っている間は控えめな見た目。全部片づいたら本来のボタンに戻る（refreshConfirmLook）
  bar.innerHTML = clean
    ? `<button class="btn" id="confirm">この試合を確定する</button>`
    : `<div class="actrow">
         <button class="btn ghost" id="nextRed" style="border-color:var(--red)">次の赤枠へ
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5470" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"></path><path d="M12.5 6.5L19 12l-6.5 5.5"></path></svg>
         </button>
         <button class="btn" id="confirm">この試合を確定する</button>
       </div>`;
  app.appendChild(bar);

  box.querySelectorAll('button[data-entry]').forEach(b => {
    b.onclick = () => openLegendSheet(b.dataset.entry, b.dataset.account);
  });
  app.querySelectorAll('input[data-field]').forEach(bindNumberInput);

  // 「確信度が低い」だけの赤は、**押して確認したときに消す。**
  //
  // 以前は入力欄にフォーカスしただけで消していた。
  // スクロール中に指が触れただけでも消えるので、**見ていないのに「確認済み」**になる。
  // 直す必要はなく目を通せばよい項目なので、ボタン1つに絞った。
  app.querySelectorAll('[data-ackall]').forEach(b => {
    b.onclick = () => {
      app.querySelectorAll('input[data-soft="1"]').forEach(i => {
        if(S.softBad[i.dataset.key]) S.ack[i.dataset.key] = true;
      });
      app.querySelectorAll('input[data-soft="1"]').forEach(i => {
        const box = i.closest('.fld');
        if(!box) return;
        if(i.dataset.field === 'kills' || i.dataset.key === 'match.squad_total_kills') return;
        box.classList.remove('bad'); box.dataset.red = 0;
      });
      refreshKillRed();
      const bar = document.getElementById('ackbar');
      if(bar) bar.remove();
    };
  });
  // 辻褄の赤は、実際に合うまで消えない。入力のたびに数え直す
  app.querySelectorAll('input[data-field="kills"], input[data-key="match.squad_total_kills"]').forEach(i => {
    i.addEventListener('input', refreshKillRed);
  });
  // 順位は埋まれば消える
  const pl = app.querySelector('input[data-key="match.squad_place"]');
  if(pl) pl.addEventListener('input', () => {
    const box = pl.closest('.fld');
    const bad = pl.value === '';
    box.classList.toggle('bad', bad); box.dataset.red = bad ? 1 : 0;
    refreshConfirmLook();
  });
  refreshConfirmLook();

  document.getElementById('applySession').onclick = applyPerspectiveToSession;
  document.getElementById('exclude').onclick = openExcludeSheet;
  document.getElementById('confirm').onclick = confirmMatch;
  const nr = document.getElementById('nextRed');
  if(nr) nr.onclick = jumpToNextRed;

  if(missing){
    const hint = document.createElement('div');
    hint.className = 'sub';
    hint.style.cssText = 'margin:10px 18px 0;text-align:center';
    hint.textContent = `メンバー${missing}人のレジェンドが未選択です。選ぶと確定できます。`;
    bar.parentNode.insertBefore(hint, bar);
  }

  if(cached === 'loading' || !cached) prefetchImages([m.image_ref]);
  window.scrollTo(0, 0);
}

function codeTitle(code){
  return ({
    KILL_SUM_MISMATCH: 'キル数の合計が合わない',
    MISSING_REQUIRED_VALUE: '読み取れなかった項目がある',
    LOW_CONFIDENCE: '読み取りに自信が無い項目がある',
    PERSPECTIVE_MISMATCH: '撮った人が特定できない',
    PLAYER_COUNT_ABNORMAL: '人数がおかしい',
    UNKNOWN_ACCOUNT: '知らないアカウントがいる',
    SPLIT_UNRESOLVED: 'スプリットが特定できない',
    CAPTURED_AT_FALLBACK: '撮影時刻が推定'
  })[code] || '確認が要ります';
}

/** 赤枠の間を移動する。直す場所を探して上下にスクロールさせないため */
function jumpToNextRed(){
  const reds = [...app.querySelectorAll('.fld.bad, .legbox.bad')];
  if(!reds.length){ toast('赤枠はもうありません'); return; }
  const y = window.scrollY + 120;
  const next = reds.find(el => el.getBoundingClientRect().top + window.scrollY > y) || reds[0];
  window.scrollTo({ top: next.getBoundingClientRect().top + window.scrollY - 110, behavior:'smooth' });
}

function low(c){ return typeof c === 'number' && c < 0.85; }

/**
 * soft=true は「確信度が低いので目を通してほしい」だけの赤。触れば消える。
 * soft=false は「直さないと辻褄が合わない」赤。実際に直るまで消えない。
 */
function numField(owner, field, label, value, isBad, soft){
  const key = owner + '.' + field;
  const bad = isBad && !(soft && S.ack[key]);
  return `<div class="fld ${bad ? 'bad' : ''}" data-red="${bad ? 1 : 0}">
    <div class="lb">${label}</div>
    <input data-owner="${esc(owner)}" data-field="${esc(field)}" data-key="${key}" data-soft="${soft ? 1 : 0}"
      type="number" inputmode="numeric"
      value="${value === null || value === undefined ? '' : value}">
  </div>`;
}

/** いま画面に残っている赤枠の数。0になったら確定ボタンを本気の見た目にする */
function redLeft(){
  return app.querySelectorAll('[data-red="1"]').length;
}

function refreshConfirmLook(){
  const btn = document.getElementById('confirm');
  if(!btn) return;
  const n = redLeft();
  btn.classList.toggle('wait', n > 0);
  btn.textContent = n > 0 ? ('残り' + n + 'か所を見てから確定') : 'この試合を確定する';
  const nr = document.getElementById('nextRed');
  if(nr) nr.style.display = n > 0 ? '' : 'none';
}

/** キル合計の辻褄を、入力中の値でその場で数え直す */
function killSumState(){
  const t = app.querySelector('input[data-key="match.squad_total_kills"]');
  const total = t && t.value !== '' ? Number(t.value) : null;
  let sum = 0, known = true;
  app.querySelectorAll('input[data-field="kills"]').forEach(i => {
    if(i.value === ''){ known = false; return; }
    sum += Number(i.value);
  });
  return { ok: known && total !== null && sum === total, sum: sum, total: total };
}

/** キル関係の赤枠を、いまの入力に合わせて付け外しする */
function refreshKillRed(){
  const st = killSumState();
  app.querySelectorAll('input[data-field="kills"], input[data-key="match.squad_total_kills"]').forEach(i => {
    const box = i.closest('.fld');
    if(!box) return;
    // 確信度による赤は別管理なので、合計が合っていてもそちらが残ることがある
    const soft = i.dataset.soft === '1' && !S.ack[i.dataset.key] && S.softBad[i.dataset.key];
    const bad = !st.ok || soft;
    box.classList.toggle('bad', bad);
    box.dataset.red = bad ? 1 : 0;
  });
  refreshConfirmLook();
}

/** 1項目直したらすぐ送る。まとめて送らないので、切れても失うのは最後の1項目だけ */
function bindNumberInput(input){
  input.dataset.original = input.value;
  input.onchange = () => {
    const owner = input.dataset.owner;
    const field = input.dataset.field;
    const value = input.value === '' ? '' : Number(input.value);
    const body = owner === 'match'
      ? { action:'update_match', match_id:S.detail.match.match_id, fields:{ [field]: value } }
      : { action:'update_entry', entry_id:owner, fields:{ [field]: value } };

    // 手元の値も更新しておく。取り直すと2〜3秒止まるので、返ってきた再計算値だけ当てる
    if(owner === 'match') S.detail.match[field] = value;
    else {
      const e = (S.detail.entries || []).filter(function(x){ return x.entry_id === owner; })[0];
      if(e) e[field] = value;
    }

    apiPost(body).then(r => {
      if(!r.ok){ throw new Error(r.error || '保存できませんでした'); }
      input.dataset.original = input.value;
      if(r.recalculated){
        S.detail.match.kill_sum_ok = r.recalculated.kill_sum_ok;
        S.detail.match.squad_survival_sec = r.recalculated.squad_survival_sec;
      }
    }).catch(err => {
      toast('保存できませんでした：' + err.message, true, () => input.onchange());
    });
  };
}

// ===================================================================
// レジェンド選択（カンバス4枚目）
// ===================================================================
function openLegendSheet(entryId, accountId, onPick){
  const recent = (S.masters.recent_legends || {})[accountId] || [];
  const legends = S.masters.legends || [];
  const byId = {}; legends.forEach(l => byId[l.legend_id] = l);
  const clsName = {};
  (S.masters.legend_classes || []).forEach(c => clsName[c.id] = c.name_ja);

  const big = recent.slice(0, 3).map(id => byId[id]).filter(Boolean);

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheetinner">
      <div class="spread">
        <span class="dela" style="font-size:17px">レジェンドを選ぶ</span>
        <button class="btn ghost" style="width:auto;height:40px;padding:0 16px" id="lclose">閉じる</button>
      </div>

      ${big.length ? `
        <div class="sub" style="margin-top:14px">よく使う3体</div>
        <div class="big3">${big.map(l =>
          `<button data-legend="${esc(l.legend_id)}" style="border-left-color:${CLASS_COLOR[l.legend_class] || 'var(--line)'}">${esc(l.name_ja)}</button>`
        ).join('')}</div>` : ''}

      ${CLASS_ORDER.filter(cid => legends.some(l => l.legend_class === cid)).map(cid => `
        <div class="clsline"><span class="dot" style="background:${CLASS_COLOR[cid]}"></span>${esc(clsName[cid] || cid)}</div>
        <div class="lgrid">${legends.filter(l => l.legend_class === cid).map(l =>
          `<button data-legend="${esc(l.legend_id)}" style="border-left-color:${CLASS_COLOR[cid]}">${esc(l.name_ja)}</button>`
        ).join('')}</div>
      `).join('')}

      <button class="btn ghost" id="lclear">レジェンド不明のままにする</button>
    </div>`;
  document.body.appendChild(sheet);

  const close = () => sheet.remove();
  sheet.querySelector('#lclose').onclick = close;
  sheet.onclick = ev => { if(ev.target === sheet) close(); };
  // 呼び出し元が受け取り方を決める。試合の詳細では即保存、まとめ修正では手元に貯める
  const pick = onPick || (id => setLegend(entryId, id));
  sheet.querySelector('#lclear').onclick = () => { pick(''); close(); };
  sheet.querySelectorAll('[data-legend]').forEach(b => {
    b.onclick = () => { pick(b.dataset.legend); close(); };
  });
}

function setLegend(entryId, legendId){
  const entry = (S.detail.entries || []).filter(function(e){ return e.entry_id === entryId; })[0];
  if(!entry) return;
  const before = entry.legend_id;

  // 先に画面へ反映する。GASの返事を待つと1回あたり4〜5秒かかり、選ぶ作業にならない
  entry.legend_id = legendId;
  renderDetail();

  apiPost({ action:'update_entry', entry_id:entryId, fields:{ legend_id:legendId } })
    .then(r => {
      if(!r.ok) throw new Error(r.error || '保存できませんでした');
    })
    .catch(err => {
      entry.legend_id = before;   // 送れなかったので画面も戻す
      renderDetail();
      toast('保存できませんでした：' + err.message, true, () => setLegend(entryId, legendId));
    });
}

// ===================================================================
// 確定・除外・一括反映
// ===================================================================
/**
 * 読めなかった画像を諦める。
 *
 * 行は消さない。status を given_up に変えて、警告の対象から外すだけ。
 * 何をどういう理由で諦めたかは、設定＞取り込みの結果で引き続き見られる。
 */
function giveUpFailed(btn){
  if(!S.key){ toast('編集キーが要ります', true); return; }
  const before = btn.textContent;
  btn.disabled = true;
  btn.textContent = '送っています…';
  apiPost({ action:'dismiss_failed_ingest' })
    .then(r => {
      if(!r.ok) throw new Error(r.error || '諦められませんでした');
      toast(r.dismissed + '件を諦めました。設定＞取り込みの結果には残っています');
      if(S.list && S.list.counts){
        S.list.counts.failed_in_queue = 0;
        cacheSet('review_list', S.list);
      }
      paintList();
    })
    .catch(err => {
      btn.disabled = false; btn.textContent = before;
      toast('できませんでした：' + err.message, true);
    });
}

function confirmMatch(){
  const btn = document.getElementById('confirm');
  btn.disabled = true;
  apiPost({ action:'confirm_match', match_id:S.detail.match.match_id })
    .then(r => {
      btn.disabled = false;
      if(!r.ok){
        const blocking = r.blocking || [];
        // レジェンドが分からないだけなら、理由を書けば確定できる道を出す。
        // 他に問題があるときは出さない（本当の不備を例外で押し通せてしまうため）
        const onlyLegend = blocking.length > 0 &&
          blocking.every(b => b.code === 'LEGEND_REQUIRED');
        if(onlyLegend){ openUnresolvedSheet(blocking); return; }
        if(blocking.length > 1){ openBlockingSheet(blocking); return; }
        toast(r.error || '確定できませんでした', true);
        return;
      }
      afterConfirmed(r);
    })
    .catch(err => { btn.disabled = false; toast('確定できませんでした：' + err.message, true, confirmMatch); });
}

/** 確定できたあとの後始末。通常確定と例外確定で共通 */
function afterConfirmed(r){
  toast(r.already ? 'すでに確定ずみです'
      : r.legend_unresolved ? 'レジェンド不明のまま確定しました' : '確定しました');
  store.del(LS.last);
  // 取り直すと1.4秒止まる。確定したことは分かっているので手元で反映する
  const mid = S.detail.match.match_id;
  if(S.list){
    S.list.matches = (S.list.matches || []).filter(m => m.match_id !== mid);
    if(S.list.counts){
      S.list.counts.pending = Math.max(0, (S.list.counts.pending || 0) - 1);
      S.list.counts.confirmed = (S.list.counts.confirmed || 0) + 1;
    }
  }
  delete S.details[mid];
  renderList();
}

/**
 * 直さないと確定できない理由の一覧。
 * サーバーが見つけたものを全部見せる。1つずつ潰させると何度も往復させることになる。
 */
function openBlockingSheet(blocking){

  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheetinner">
      <div class="spread">
        <span class="dela" style="font-size:17px">まだ確定できません</span>
        <button class="btn ghost" style="width:auto;height:40px;padding:0 16px" id="bclose">閉じる</button>
      </div>
      <div class="sub" style="margin-top:12px">次の${blocking.length}件を直してください。</div>
      <div style="margin-top:12px">
        ${blocking.map(b => `
          <div class="card red" style="margin-top:8px">
            <div style="font-size:14px;line-height:1.7">${esc(b.detail || b.code)}</div>
          </div>`).join('')}
      </div>
    </div>`;

}

/**
 * レジェンドが分からないまま確定するための口。
 *
 * リザルト画面のキャラ絵は装飾・スキン・アニメーションで判別できないことがあり、
 * 「思い出せないから永遠に確定できない」を避けるために開けてある。
 * ただし黙って通さない。理由を書いてもらい、編集履歴に残す。
 */

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheetinner">
      <div class="spread">
        <span class="dela" style="font-size:17px">レジェンドが分からない</span>
        <button class="btn ghost" style="width:auto;height:40px;padding:0 16px" id="uclose">閉じる</button>
      </div>
      <div class="sub" style="margin-top:12px">

      <div class="card" style="margin-top:14px">
        <div style="font-size:14px;line-height:1.75">
          分からないまま確定できます。ただし<b style="color:var(--yellow)">この試合はレジェンド別の成績には入りません</b>。
          個人の成績（キル・ダメージなど）には入ります。
        </div>
      </div>
      <div class="sub" style="margin-top:14px">理由（あとで見返すため。必須）</div>
      <textarea id="unote" rows="2" placeholder="例：スキンで分からない／覚えていない"
        style="width:100%;margin-top:6px;padding:11px 13px;border-radius:11px;

               font-family:inherit;font-size:15px;line-height:1.6;resize:none"></textarea>
      <button class="btn limeline" id="ugo" style="margin-top:14px">このまま確定する</button>

/** レジェンドと撮影者だけをその日の全試合へ。キル数やダメージは試合ごとに違うので含めない */

// ===================================================================
// キャラをまとめて直す
//
// 1体ずつ保存すると1回2〜3秒の往復が体数ぶん要る（10試合で30往復）。
// ここでは手元に貯めるだけにして、最後の「一括反映」で1往復だけ送る。
// 埋める順は上から。2件目以降は「上と同じ構成にする」で3枠まとめて写せる。
// ===================================================================
async function openBulkLegends(sessionId){
  S.view = 'bulk';
  titleEl.textContent = 'キャラをまとめて直す';
  backEl.hidden = false;
  app.innerHTML = '<div class="card" style="margin-top:8px"><div class="sub">読み込み中…</div></div>';

  try{
    S.bulk = await apiGet(sessionId ? { action:'session_legends', session_id:sessionId }
                                    : { action:'session_legends' });
  }catch(e){
    app.innerHTML = `<div class="card red" style="margin-top:8px">読み込めませんでした。
      <div class="sub" style="margin-top:6px">${esc(e.message)}</div></div>`;
    return;
  }

  // 手元の下書き。いまシートに入っている値を初期値にする（空欄は空欄のまま）
  S.draft = {};
  S.bulk.matches.forEach(m => m.entries.forEach(e => { S.draft[e.entry_id] = e.legend_id || ''; }));
  renderBulk();
  prefetchImages(S.bulk.matches.map(m => m.image_ref));
}

/** メンバーぶんの枠がいくつ埋まっているか。野良は数えない */
function bulkCounts(){
  let need = 0, done = 0;
  S.bulk.matches.forEach(m => m.entries.forEach(e => {
    if(e.is_stranger) return;
    need++;
    if(S.draft[e.entry_id]) done++;
  }));
  return { need, done };
}

/** その試合のメンバー枠が全部埋まっているか。「上と同じ構成」を押せるかの判定に使う */
function matchFilled(m){
  return m.entries.filter(e => !e.is_stranger).every(e => !!S.draft[e.entry_id]);
}

/**
 * 「上と同じ構成にする」の中身。**席ではなく「人」で写す。**
 *
 * 以前は card_slot（左・中央・右）で対応させていた。
 * リザルト画面の並びは試合ごとに変わるので、
 * **別人のキャラが割り当てられる**（しかも画面上は自然に見えるので気づけない）。
 * 中央は撮った人で固定だが、左右は固定ではない。
 *
 * draft を直接書き換え、何枠写したかを返す。
 * 画面に触らない純粋な処理にしてあるので、単体で検証できる。
 *
 * @param {Object} prev  前の試合（entries を持つ）
 * @param {Object} cur   いまの試合
 * @param {Object} draft entry_id → legend_id の下書き。ここを書き換える
 * @return {{copied:number, notThere:number}}
 */
function copySameComposition(prev, cur, draft){
  const byAcc = {};
  (prev.entries || []).forEach(pe => {
    if(pe.is_stranger) return;
    const acc = String(pe.account_id || '');
    if(!acc) return;
    // 同じアカウントが2枠にいる異常データは、対応が決められないので写さない
    byAcc[acc] = (byAcc[acc] === undefined) ? (draft[pe.entry_id] || '') : null;
  });

  let copied = 0, notThere = 0;
  (cur.entries || []).forEach(ce => {
    if(ce.is_stranger) return;
    const acc = String(ce.account_id || '');
    const v = acc ? byAcc[acc] : undefined;
    if(v === undefined || v === null){ notThere++; return; }  // 前の試合にいない／曖昧
    if(!v) return;                                            // 前も空欄。触らない
    draft[ce.entry_id] = v;
    copied++;
  });

  return { copied, notThere };
}

/**
 * シートの値と手元の下書きが食い違っている枠。これが「送るもの」。
 *
 * **空欄に戻す変更も含める。**以前は値が入っている枠しか送っていなかったので、
 * 間違って入れたキャラを消す手段が無かった。
 */
function bulkChanges(){
  const legById = {}; (S.masters.legends || []).forEach(l => legById[l.legend_id] = l);
  const name = id => id ? (legById[id] ? legById[id].name_ja : id) : '';
  const out = [];
  S.bulk.matches.forEach(m => m.entries.forEach(e => {
    if(e.is_stranger) return;
    const to = S.draft[e.entry_id] || '';
    const from = e.legend_id || '';
    if(to === from) return;
    out.push({
      entry_id: e.entry_id,
      seq: m.seq,
      who: e.person_name || e.raw_name || '(名前不明)',
      from: name(from),
      to: name(to),
      legend_id: to
    });
  }));
  return out;
}

function renderBulk(){
  const legById = {}; (S.masters.legends || []).forEach(l => legById[l.legend_id] = l);
  const c = bulkCounts();
  const ch = bulkChanges();

  const body = S.bulk.matches.map((m, i) => {
    const prev = S.bulk.matches[i - 1];
    const canSame = !!prev && matchFilled(prev);
    const cached = S.images[m.image_ref];

    const slots = m.entries.map(e => {
      const id = S.draft[e.entry_id] || '';
      const leg = legById[id];
      const who = e.is_stranger ? '野良' : (e.person_name || e.raw_name);
      if(e.is_stranger){
        return `<div class="bslot stranger"><div class="who">${esc(who)}</div>
          <div class="leg">対象外</div></div>`;
      }
      const cls = id ? 'bslot filled' : 'bslot empty';
      const color = leg ? (CLASS_COLOR[leg.legend_class] || '') : '';
      return `<div class="${cls}" data-slot="${esc(e.entry_id)}" data-acc="${esc(e.account_id)}"
                   ${color ? 'style="border-color:'+color+'"' : ''}>
        <div class="who">${esc(who)}</div>
        <div class="leg">${leg ? esc(leg.name_ja) : '選ぶ'}</div>
      </div>`;
    }).join('');

    return `<div class="bmatch">
      <div class="bh">
        <span class="bseq">${m.seq}戦目</span>
        <span class="bpl">${m.squad_place === null ? '順位なし' : m.squad_place + '位'}</span>
        ${i > 0 ? `<button class="bsame" data-same="${i}" ${canSame ? '' : 'disabled'}>上と同じ構成にする</button>` : ''}
      </div>
      ${cached && cached !== 'loading'
        ? `<img class="bshot" src="${cached}" data-file-id="${esc(m.image_ref)}" alt="リザルト画面">`
        : `<div class="bshotbox" data-file-id="${esc(m.image_ref)}"><span class="sub">スクショ読み込み中…</span></div>`}
      <div class="bslots">${slots}</div>
    </div>`;
  }).join('');

  app.innerHTML =
    `<div class="bhead">
       <span class="sub">上から順に、スクショを見ながら選びます</span>
       <span class="cnt">${c.done} / ${c.need}</span>
     </div>` +
    body +
    `<div class="bbar">
       <button class="btn" id="bulkGo" ${ch.length === 0 ? 'disabled' : ''}>
         ${ch.length ? `変更を確かめて送る（${ch.length}枠）` : '変えたところがありません'}
       </button>
     </div>`;

  app.querySelectorAll('[data-slot]').forEach(el => {
    el.onclick = () => openLegendSheet(el.dataset.slot, el.dataset.acc, id => {
      S.draft[el.dataset.slot] = id;
      renderBulk();
    });
  });
  app.querySelectorAll('[data-same]').forEach(b => {
    b.onclick = () => {
      const i = Number(b.dataset.same);
      const prev = S.bulk.matches[i - 1], cur = S.bulk.matches[i];

      const r = copySameComposition(prev, cur, S.draft);
      renderBulk();
      toast(r.notThere
        ? `${r.copied}枠を写しました（${r.notThere}枠は前の試合にいないので空欄のまま）`
        : `${r.copied}枠を写しました`);
    };
  });
  const go = document.getElementById('bulkGo');
  if(go) go.onclick = sendBulkLegends;
}

/**
 * 送る前に、何がどう変わるかを全部見せる。
 *
 * まとめて直す画面は一度に何十枠も動かせるので、
 * 「上と同じ構成にする」を押し間違えたことに気づけないまま送れてしまう。
 * 送信は取り消せない（履歴には残るが、戻すのは手作業）ので、ここで一度止める。
 */
function sendBulkLegends(){
  if(!S.key){ toast('編集キーが要ります。登録タブの設定で入れてください', true); return; }
  const ch = bulkChanges();
  if(!ch.length){ toast('変えたところがありません'); return; }

  const rows = ch.map(c => `
    <div class="crow">
      <span class="cseq">${c.seq}戦目</span>
      <span class="cwho">${esc(c.who)}</span>
      <span class="cval">
        <span class="from">${c.from ? esc(c.from) : '空欄'}</span>
        <span class="arw">→</span>
        <span class="to ${c.to ? '' : 'blank'}">${c.to ? esc(c.to) : '空欄にする'}</span>
      </span>
    </div>`).join('');

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheetinner">
      <div class="spread">
        <span class="dela" style="font-size:17px">これで送ります</span>
        <button class="btn ghost" style="width:auto;height:40px;padding:0 16px" id="cclose">やめる</button>
      </div>
      <div class="sub" style="margin-top:10px">${ch.length}枠が変わります。<b>ここに出ていない枠は触りません。</b></div>
      <div class="clist">${rows}</div>
      <button class="btn limeline" id="cgo" style="margin-top:14px">送る</button>
    </div>`;
  document.body.appendChild(sheet);

  const close = () => sheet.remove();
  sheet.querySelector('#cclose').onclick = close;
  sheet.onclick = ev => { if(ev.target === sheet) close(); };

  sheet.querySelector('#cgo').onclick = () => {
    const go = sheet.querySelector('#cgo');
    go.disabled = true; go.textContent = '送っています…';

    apiPost({
      action: 'bulk_update_legends',
      items: ch.map(c => ({ entry_id: c.entry_id, legend_id: c.legend_id }))
    })
      .then(r => {
        if(!r.ok) throw new Error(r.error || '反映できませんでした');
        close();
        toast(r.changed + '枠を反映しました');
        // 送った内容を手元にも反映して、押し直しても二重に送らないようにする
        S.bulk.matches.forEach(m => m.entries.forEach(e => { e.legend_id = S.draft[e.entry_id] || ''; }));
        S.list = null; S.details = {};
        renderBulk();
      })
      .catch(err => {
        go.disabled = false; go.textContent = '送る';
        toast('反映できませんでした：' + err.message, true);
      });
  };
}

// ===================================================================
// 起動
// ===================================================================
async function boot(){
  renderTabs();
  if(!S.url){ renderSetup(); return; }
  // ?match=… で来たら、その試合を直接開く（確定ずみでも開ける）
  const want = new URLSearchParams(location.search).get('match');

  // 人・アカウント・レジェンドの一覧はめったに変わらない。控えがあれば待たずに進む
  const cachedMasters = cacheGet('masters');
  if(cachedMasters){
    S.masters = cachedMasters;
    apiGet({ action:'masters' })
      .then(j => { S.masters = j; cacheSet('masters', j); })
      .catch(() => {});
  }else{
    app.innerHTML = `<div class="card" style="margin-top:8px">
        <div class="dela" style="font-size:15px">サーバーに聞いています…</div>
        <div class="sub" style="margin-top:8px">数秒かかります。そのままお待ちください。</div>
      </div>`;
    try{
      S.masters = await apiGet({ action:'masters' });
      cacheSet('masters', S.masters);
    }catch(e){
      app.innerHTML = `<div class="card red" style="margin-top:8px">サーバーに繋がりません。設定を確認してください。
        <div class="sub" style="margin-top:6px">${esc(e.message)}</div></div>`;
      return;
    }
  }
  if(!S.personId){ renderSetup(); return; }
  if(want){ await openDetail(want); warmOtherScreens(S.personId); return; }
  await renderList();
  warmOtherScreens(S.personId);
}

backEl.onclick = () => { S.bulk = null; renderList(); };
gearEl.onclick = () => renderSetup();

boot();
</script>

<script>
// ホーム画面のアイコンから開けるようにする。電波が悪くても画面自体は出る。
// 数字の控えは画面側（localStorage）が持っているので、ここでは触らない。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {
      // 登録できなくてもアプリは普通に動く。file:// で開いたときなど
    });
  });
}
</script>
